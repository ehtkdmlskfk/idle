function equipB(i){const it=S.bag[i];if(!it)return;const cur=S.gear[it.s];S.gear[it.s]=it;S.bag.splice(i,1);if(cur)S.bag.push(cur);clampHp();say('장착: '+it.n)}

function sellB(i){const it=S.bag[i];if(!it)return;S.meso+=sp(it);S.bag.splice(i,1);say(it.n+' 판매 +'+sp(it)+'루멘')}
