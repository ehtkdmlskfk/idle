<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잿불</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  --void:#0a0908; --well:#100d0a; --line:#2a241d; --dim:#8a7e6e; --bone:#e2d8c6;
  --ember:#e9a24f; --hot:#ffe3a6; --blood:#b2352b;
  --ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --disp:'Do Hyeon','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --lore:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--void:#0a0908;--bone:#e2d8c6}}
:root[data-theme="dark"]{--void:#0a0908;--bone:#e2d8c6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--void)}
*{box-sizing:border-box}
body{
  height:100%;margin:0;color:var(--bone);
  background:radial-gradient(120% 55% at 50% 0%,#1e150d 0%,var(--void) 65%);
  font-family:var(--ui);line-height:1.45;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-variant-numeric:tabular-nums;
}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* 상단: 층 + 재화 */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px 8px}
.floor{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:4px;min-width:0}
.floor b{display:inline-block;font-family:var(--disp);font-weight:400;font-size:52px;line-height:1;color:var(--hot);
  text-shadow:0 3px 0 #7a3a10,0 0 22px rgba(233,162,79,.45)}
.floor b.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
.floor .u{font-family:var(--disp);font-size:20px;color:var(--ember)}
.floor small{flex-basis:100%;font-size:11px;color:var(--dim);white-space:nowrap}
.wallet{position:relative;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pill{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;min-width:120px;padding:3px 10px 3px 4px;border-radius:999px;
  background:linear-gradient(#0b0907,#171310);border:1px solid #3a2f22;box-shadow:inset 0 1px 3px #000}
.pill .coin{flex:none;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1c4,#e9a24f 55%,#8a4a14);box-shadow:0 0 0 1px #4a2a0c}
.pill.ash .coin{background:radial-gradient(circle at 35% 30%,#f1eadc,#9a8f7c 55%,#4a4136);box-shadow:0 0 0 1px #2a241d}
/* 값(b)이나 증가분(em)이 길어지면(억/조/경 단위, +숫자) 공간이 부족할 때 안에서 줄바꿈돼 알약이
   두 줄로 늘어나 보이던 문제가 있었음 — 셋 다 한 줄 고정(nowrap)으로 막고, 대신 폭이 부족하면
   알약 자체가 옆으로 넓어지게(줄바꿈 대신 확장) 둠 */
.pill .lb{font-size:11px;color:var(--dim);white-space:nowrap;flex:none}
.pill b{margin-left:auto;font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.2;color:var(--bone);white-space:nowrap;flex:none}
.pill em{font-style:normal;font-size:11px;font-weight:700;color:var(--ember);white-space:nowrap;flex:none}
/* 길드 버프 뱃지 — 지갑 칼럼 맨 위 줄. 절대배치로 "안 겹치면서 화면 안에도 들어오게" 하려면
   헤더 위쪽 여백이 10px밖에 없어서 물리적으로 불가능함(둘 중 하나는 항상 깨짐) — 그래서
   대신 이 줄 자체는 항상 같은 자리를 차지해두고(display는 항상 flex), 길드 버프가 없을 땐
   visibility:hidden으로 안 보이기만 하게 해서 "생겼다 없어졌다 할 때 화면이 위아래로
   흔들리는" 것만은 막았다. 완전히 자리를 안 차지하게 하려면 알약을 가리거나(예전) 화면
   밖으로 잘리는(그 다음 시도) 문제 중 하나를 감수해야 해서, 절충안으로 이 방식을 택함. */
.gbuf{visibility:hidden;display:flex;align-items:center;gap:2px;
  font-size:9.5px;font-weight:700;color:#1a1410;letter-spacing:.2px;
  background:linear-gradient(135deg,#f1c27d,#c9791f);padding:2px 7px 2px 5px;border-radius:999px;
  box-shadow:0 0 0 1px #2a1f14,0 2px 4px rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}
.gbuf.show{visibility:visible}
.gbuf .gi{flex:none;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1c4,#e9631f 60%);box-shadow:0 0 3px #ff8a3a}

/* 전투 화면 */
#stage{position:relative;margin:0 12px;height:clamp(170px,28vh,240px);border-radius:18px;border:2px solid #3a2f22;overflow:hidden;background:#0a0908;
  box-shadow:0 0 0 1px #000,0 6px 18px rgba(0,0,0,.6),inset 0 0 26px rgba(0,0,0,.55)}
#cv{display:block;width:100%;height:100%}
.hud{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--disp);font-size:13px;color:#5a4a39;letter-spacing:.2em;pointer-events:none}
.snd{min-height:28px;padding:4px 10px;border-radius:999px;border:1px solid #3a2f22;background:rgba(10,9,8,.55);color:var(--dim);font-size:11px}
#boss{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;
  padding:2px 12px;border-radius:999px;font-family:var(--disp);font-size:14px;color:#ffe3dc;
  background:linear-gradient(#c4402f,#7a1f16);border:1px solid #e07a6b;box-shadow:0 2px 0 #40100b,0 0 14px rgba(196,64,47,.5);
  transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#boss.show{opacity:1;transform:translateX(-50%) scale(1)}

#evt{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;
  padding:2px 12px;border-radius:999px;font-family:var(--disp);font-size:13px;letter-spacing:.02em;
  border:1px solid; transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#evt.show{opacity:1;transform:translateX(-50%) scale(1)}
#evt.gold{color:#3a2306;background:linear-gradient(#f4c479,#e08a2f);border-color:#ffdca0;box-shadow:0 2px 0 #7a3a10,0 0 14px rgba(233,162,79,.5)}
#evt.red{color:#ffe3dc;background:linear-gradient(#c4402f,#7a1f16);border-color:#e07a6b;box-shadow:0 2px 0 #40100b,0 0 14px rgba(196,64,47,.5)}
#evt.teal{color:#062a26;background:linear-gradient(#8fe0cf,#3f9a89);border-color:#c4f3e8;box-shadow:0 2px 0 #0d3a33,0 0 14px rgba(79,187,163,.5)}

.ds.lore{margin-top:3px;font-family:var(--lore);font-size:11.5px;color:#7d725f}

/* 유해를 여는 순간 */
#rv{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(circle at 50% 38%,rgba(52,26,10,.97),rgba(6,5,4,.99))}
#rv.show{display:flex}
.rvbox{width:100%;max-width:360px;max-height:100%;overflow-y:auto;text-align:center;-webkit-overflow-scrolling:touch}
.rvhead{margin-bottom:12px;font-family:var(--disp);font-size:20px;color:var(--hot)}
.g1{--gc:#9a8f7c;--gg:rgba(154,143,124,.30)}
.g2{--gc:#6fb3a8;--gg:rgba(111,179,168,.40)}
.g3{--gc:#e9a24f;--gg:rgba(233,162,79,.50)}
.g4{--gc:#ffe3a6;--gg:rgba(255,227,166,.62)}
.rvc{padding:22px 18px 18px;border-radius:22px;border:2px solid var(--gc);
  background:radial-gradient(120% 70% at 50% 0%,var(--gg),rgba(0,0,0,0) 70%),linear-gradient(#1d1812,#100d0a);
  box-shadow:0 0 0 1px #000,0 0 38px var(--gg),inset 0 0 26px rgba(0,0,0,.6);
  animation:rvpop .6s cubic-bezier(.2,1.5,.4,1)}
.rvc.g3,.rvc.g4{animation:rvpop .6s cubic-bezier(.2,1.5,.4,1),rvglow 2.2s ease-in-out .6s infinite}
.rvg{font-size:12px;font-weight:700;color:var(--gc)}
.rvn{margin-top:6px;font-family:var(--disp);font-size:30px;line-height:1.2;color:var(--hot);text-shadow:0 2px 0 #40200a,0 0 20px var(--gg)}
.rvs{margin:12px 6px 0;font-family:var(--lore);font-size:13px;line-height:1.7;color:var(--bone)}
.rve{margin-top:14px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid #3a2f22;font-size:13px;font-weight:700;color:var(--ember)}
.rvt{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--gc)}
.rvr{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:9px 12px;border-radius:14px;text-align:left;
  background:linear-gradient(#1d1812,#14100c);border:1px solid var(--gc);box-shadow:0 0 12px var(--gg)}
.rvr .rn{flex:1;min-width:0;font-family:var(--disp);font-size:17px;color:var(--hot);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvr .rg{flex:none;font-size:11px;font-weight:700;color:var(--gc)}
.rvr .rt{flex:none;min-width:58px;text-align:right;font-size:11.5px;font-weight:700;color:var(--dim)}
.rvok{display:block;margin:16px auto 0;min-width:140px;min-height:44px;padding:8px 22px;border:0;border-radius:14px;
  font-family:var(--disp);font-size:18px;color:#2a1300;background:linear-gradient(#f4b862,#cf7a22);box-shadow:0 3px 0 #7a3a10}
.rvok:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3a10}
@keyframes rvpop{0%{transform:scale(.55) rotate(-3deg);opacity:0}60%{transform:scale(1.06) rotate(.5deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes rvglow{0%,100%{box-shadow:0 0 0 1px #000,0 0 30px var(--gg),inset 0 0 26px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 1px #000,0 0 56px var(--gg),inset 0 0 26px rgba(0,0,0,.6)}}

/* 지금 받는 기운(임시 강화) */
#buf{position:absolute;left:10px;bottom:10px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;pointer-events:none;
  color:#062a26;background:linear-gradient(#8fe0cf,#3f9a89);border:1px solid #c4f3e8;box-shadow:0 2px 0 #0d3a33;opacity:0;transition:opacity .25s}
#buf.show{opacity:1}

#away{position:absolute;left:0;right:0;top:0;transform:translateY(-100%);opacity:0;pointer-events:none;z-index:5;
  text-align:center;padding:9px 44px 9px 14px;font-family:var(--ui);font-size:12.5px;font-weight:700;border-radius:16px 16px 0 0;
  color:#2a1300;background:linear-gradient(#f4c479,#e08a2f);border-bottom:1px solid #ffdca0;box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:opacity .35s,transform .35s}
#away.show{opacity:1;transform:translateY(0)}

/* 새 버전 배포 알림 — 화면을 보고 있을 때만 뜨고, 안 보고 있으면 조용히 새로고침된다 */
#upd,#updDone{position:fixed;left:50%;top:0;transform:translateX(-50%) translateY(-100%);opacity:0;pointer-events:none;
  width:100%;max-width:480px;z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;
  font-family:var(--ui);font-size:12.5px;font-weight:700;color:#2a1300;
  background:linear-gradient(#f4c479,#e08a2f);border-bottom:1px solid #ffdca0;box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:opacity .35s,transform .35s}
#upd.show,#updDone.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#upd button{flex:none;min-height:30px;padding:0 14px;border:1px solid rgba(0,0,0,.3);border-radius:999px;
  font-family:var(--disp);font-size:13px;color:#2a1300;background:rgba(0,0,0,.15)}
#upd button:active{transform:translateY(1px)}
#updDone{color:#062a26;background:linear-gradient(#8fe0cf,#3f9a89);border-bottom:1px solid #c4f3e8}

/* 태우기: 쿨다운 링이 달린 원형 스킬 버튼 */
#burn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:68px;height:68px;padding:4px;border:0;border-radius:50%;
  background:conic-gradient(#ffd27a var(--p,100%),#2a221a 0);
  box-shadow:0 3px 10px rgba(0,0,0,.7);transition:transform .08s}
#burn .in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  background:radial-gradient(circle at 50% 30%,#ffb45a,#c9711f 60%,#7a3a10);border:2px solid #2a1300;color:#2a1300}
#btxt{font-family:var(--disp);font-size:16px}
#burn small{font-size:10px;font-weight:700;opacity:.75}
#burn:not(:disabled){animation:ready 1.8s ease-in-out infinite}
#burn:active:not(:disabled){transform:translateX(-50%) scale(.93)}
#burn:disabled .in{background:radial-gradient(circle at 50% 30%,#3a3026,#1d1812);border-color:#0a0908;color:#7d7264}

/* 사망 화면 */
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:radial-gradient(circle,rgba(34,9,7,.84),rgba(6,5,4,.93));opacity:0;pointer-events:none;transition:opacity .6s}
#over.show{opacity:1;pointer-events:auto}
.o1{font-family:var(--disp);font-size:34px;color:var(--bone);text-shadow:0 3px 0 #40100b,0 0 22px rgba(196,64,47,.5)}
.o2{padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid #5a3a1c;font-size:14px;font-weight:700;color:var(--ember)}
.o2:empty{display:none}
.o3{min-height:18px;font-size:12px;color:var(--dim)}
.o3:not(:empty){animation:blink 1.4s ease-in-out infinite}
.o5{max-width:82%;font-size:11px;line-height:1.45;color:var(--dim);opacity:.75}
.o5:empty{display:none}

/* 불꽃 / 적 체력 바 */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 0}
.bar{position:relative;height:24px;border-radius:12px;background:#0b0907;border:2px solid #2a2118;overflow:hidden;box-shadow:inset 0 2px 4px #000}
.fill{position:absolute;inset:0;transform-origin:left center;transition:transform .2s ease-out}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
.fill.fire{background:linear-gradient(90deg,#9a4416,var(--ember))}
.fill.foe{background:linear-gradient(90deg,#5a1710,#b2352b)}
.bar.low{animation:low .9s ease-in-out infinite}
.bar.low .fill.fire{background:linear-gradient(90deg,#6b1712,#d0503f)}
.bar span{position:relative;display:block;padding:0 9px;font-size:12px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff4e0;text-shadow:0 1px 2px #000}

#log{padding:8px 18px 2px;height:62px;overflow:hidden;font-family:var(--lore);font-size:12.5px;line-height:1.45;color:var(--dim)}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .new{color:var(--bone)}
#log .gold{color:var(--ember)}
#log .red{color:#c4584d}

/* 하단 탭바 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px 8px;
  background:linear-gradient(#15110d,#0c0a08);border-top:2px solid #2a2118;box-shadow:0 -8px 18px rgba(0,0,0,.5)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:6px 0 5px;
  border:0;border-radius:14px;background:none;color:var(--dim);font-size:12px;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--hot);background:linear-gradient(rgba(233,162,79,.18),rgba(233,162,79,.04));box-shadow:inset 0 2px 0 var(--ember)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(233,162,79,.7))}
.tabs button.ping::after{content:"";position:absolute;top:6px;left:calc(50% + 10px);width:11px;height:11px;border-radius:50%;
  background:var(--blood);border:2px solid #15110d;box-shadow:0 0 8px rgba(196,64,47,.8)}

/* 패널: 카드형 목록 */
#panel{flex:1;min-height:0;overflow-y:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch}
.modes{display:flex;justify-content:flex-end;padding:8px 0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#0b0907;border:1px solid var(--line);box-shadow:inset 0 1px 3px #000}
.chip{min-height:30px;padding:5px 14px;border:0;border-radius:999px;background:none;color:var(--dim);font-size:13px;font-weight:700}
.chip.on{background:linear-gradient(#f0b25e,#c9711f);color:#2a1300}
.chip{position:relative}
.chip.ping::after{content:"";position:absolute;top:1px;right:3px;width:8px;height:8px;border-radius:50%;
  background:var(--blood);border:2px solid #15110d;box-shadow:0 0 6px rgba(196,64,47,.8)}
.note{margin:10px 0 8px;padding:10px 12px;border-radius:12px;background:var(--well);border:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.6}
.note b{color:var(--ember);font-weight:700}
.sec{padding:14px 2px 6px;font-size:12px;font-weight:700;color:var(--dim)}

.card{display:grid;grid-template-columns:46px 1fr auto;column-gap:12px;align-items:center;width:100%;margin:0 0 8px;padding:10px;
  text-align:left;color:var(--bone);border-radius:16px;border:1px solid #2f261c;
  background:linear-gradient(#1d1812,#14100c);box-shadow:0 2px 0 #050403;transition:transform .08s,border-color .2s}
.card:active:not(.own){transform:scale(.98)}
.card.can{border-color:#7a5428;box-shadow:0 2px 0 #050403,0 0 14px rgba(233,162,79,.12)}
.card.own{cursor:default}
.card.pop{animation:pop .4s ease-out}
.ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;color:var(--tc,var(--ember));
  background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.08),rgba(0,0,0,.35)),#0e0b08;border:1px solid #3a2f22}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.card:not(.can):not(.own) .ic svg{opacity:.5}
.mid{min-width:0}
.nm{display:flex;align-items:center;gap:7px}
.nm .n{font-family:var(--disp);font-size:18px;line-height:1.2;color:var(--bone)}
.card.can .n,.card.own .n{color:var(--hot)}
.lv{padding:0 7px;border-radius:999px;background:#0b0907;border:1px solid #3a2f22;font-size:11px;font-weight:700;line-height:18px;color:var(--dim)}
.lv:empty{display:none}
.ds{margin-top:2px;font-size:12px;color:var(--dim)}
.buy{min-width:78px;padding:7px 12px 8px;border-radius:12px;text-align:center;font-family:var(--disp);font-size:16px;line-height:1.15;
  background:#211b14;border:1px solid #2f261c;color:#6a5f52;box-shadow:0 3px 0 #0a0806}
.buy .c::before{content:"";display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:50%;vertical-align:-1px;opacity:.55;
  background:radial-gradient(circle at 35% 30%,#fff1c4,#e9a24f 60%,#8a4a14)}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'ember-idle-v1';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- 숫자 표기 (만/억/조...) ---------- */
function fmt(n){
  if (!isFinite(n)) return '∞';
  n = Math.max(0, n);
  if (n < 10000) return String(Math.floor(n));
  const U = ['', '만', '억', '조', '경', '해', '자', '양'];
  const i = Math.floor(Math.log10(n) / 4);
  if (i >= U.length) return n.toExponential(2);
  const v = n / Math.pow(10000, i);
  let s = v >= 100 ? String(Math.floor(v)) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  if (s.includes('.')) s = s.replace(/\.?0+$/, '');
  return s + U[i];
}

/* ---------- 상태 ---------- */
const def = () => ({
  souls: 0, ash: 0, total: 0, best: 1, runs: 0,
  floor: 1, kills: 0, hp: 40, sps: 0, lastSeen: Date.now(),
  lv: { atk: 0, hp: 0, spd: 0, greed: 0, crit: 0 },
  meta: { ember: 0, leg: 0, desc: 0, hand: 0, eye: 0, auto: 0, autoEnc: 0, autoOpen: 0, autoRelic: 0, slot: 0, spark: 0, away: 0, awayEff: 0, eng: 0 },
  relics: [], offers: [], rr: 0, mute: false, vol: 1, evt: null,
  encs: [], buf: null, stance: 0,
  pil: {}, eq: [], rems: [], pity: 0, nick: '',
  eng: [], metRelics: [],
  hl: { hand: null, neck: null, chest: null }, hlQueue: 0, hlSeen: { common: 0, rare: 0, epic: 0, legend: 0 }
});
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const o = JSON.parse(raw), d = def();
    const s = Object.assign(d, o, { lv: Object.assign(d.lv, o.lv), meta: Object.assign(d.meta, o.meta) });
    // 예전 버전에서 값이 깨져(NaN → 저장 시 null로 변함) 들어온 레벨을 0으로 복구
    ['lv', 'meta'].forEach(g => { for (const k in s[g]) if (typeof s[g][k] !== 'number' || !isFinite(s[g][k])) s[g][k] = 0; });
    return s;
  } catch (e) { return null; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

let S = load();
const fresh = !S;
if (fresh) S = def();

/* ---------- 능력치 ---------- */
const ashM = () => 1 + 0.1 * S.total;
const rel = id => S.relics.indexOf(id) >= 0;
const isEng = id => S.eng.indexOf(id) >= 0;
const ENG_FRAC = 0.4;               // 각인만 된(직접 줍지 않은) 유물은 원래 효과의 40%만 적용
const relLvl = id => rel(id) ? 1 : (isEng(id) ? ENG_FRAC : 0);
const engSlots = () => ALT.eng.val(S.meta.eng);
const engToggleCost = () => 8;
const bufM = k => (S.buf && S.buf.k === k ? S.buf.m : 1);   // 사건으로 받은 임시 기운

/* ---------- 먼저 온 이들 ----------
   죽으면(REM_MIN층 이상) 쓰러진 순례자의 유해가 남는다. 열면 순례자를 만나고, 같은 이를 또 만나면 Lv이 오른다.
   이어받은(계승) 순례자의 능력만 적용된다. e: [[효과 종류, Lv1 수치], ...] */
const PIL_MAX = 10, REM_MIN = 3, REM_CAP = 12, PITY = 15;
const GN = ['', '이름 없는 자', '기억되는 자', '불씨를 남긴 자', '재의 성인'];
const GC = ['', '#9a8f7c', '#6fb3a8', '#e9a24f', '#ffe3a6'];
const pc = v => (Math.round(v * 1000) / 10) + '%';
const KIND = {
  hp:   { n: '최대 불꽃',       f: v => '+' + pc(v) },
  aps:  { n: '공격 속도',       f: v => '+' + pc(v) },
  soul: { n: '영혼 획득',       f: v => '+' + pc(v) },
  atk:  { n: '공격력',          f: v => '+' + pc(v) },
  heal: { n: '처치 시 회복',    f: v => '+' + pc(v) + 'p' },
  calm: { n: '불꽃 소모',       f: v => '−' + pc(v) },
  crit: { n: '치명타 확률',     f: v => '+' + pc(v) + 'p' },
  boss: { n: '보스 피해',       f: v => '+' + pc(v) },
  rest: { n: '층 이동 시 회복', f: v => '+' + pc(v) },
  ash:  { n: '사망 시 재',      f: v => '+' + pc(v) },
  cd:   { n: '태우기 재사용',   f: v => '−' + pc(v) }
};
const PIL = {
  elder:   { n: '지팡이 쥔 노인',   g: 1, e: [['hp', .06]],   s: '지팡이를 끝까지 놓지 않았다. 마지막 계단에서도.' },
  child:   { n: '맨발의 아이',      g: 1, e: [['aps', .04]],  s: '발소리가 가장 가벼웠다. 어둠도 뒤늦게 알아챘다.' },
  scribe:  { n: '이름 없는 필사가', g: 1, e: [['soul', .06]],  s: '죽은 이들의 이름을 적다가, 제 이름을 잊었다.' },
  soldier: { n: '절름발이 병사',    g: 1, e: [['atk', .06]],  s: '다리를 끌며 내려왔다. 물러서는 법은 몰랐다.' },
  widow:   { n: '눈물의 여인',      g: 1, e: [['heal', .01]], s: '울면서도 걸었다. 손에 든 불은 꺼지지 않았다.' },
  carrier: { n: '촛농 나르는 자',   g: 2, e: [['calm', .05]], s: '식은 촛농을 등에 지고 날랐다. 어디로 가는지는 말하지 않았다.' },
  monk:    { n: '종을 든 수도사',   g: 2, e: [['crit', .02]], s: '종소리가 끊기는 곳에서, 그는 무언가를 보았다.' },
  knight:  { n: '등을 돌린 기사',   g: 2, e: [['boss', .12]], s: '문지기 앞에서 한 번도 돌아서지 않았다. 등만 남았다.' },
  boy:     { n: '길을 아는 소년',   g: 2, e: [['rest', .03]], s: '"아래로 가는 길은 알아요." 그가 아는 건 그것뿐이었다.' },
  priest:  { n: '재를 뿌리는 사제', g: 3, e: [['ash', .06], ['calm', .03]],  s: '모든 것이 재가 된다고 믿었다. 그래서 재를 아꼈다.' },
  jester:  { n: '웃던 광대',        g: 3, e: [['cd', .06], ['crit', .015]],   s: '어둠 속에서도 끝까지 웃었다. 웃음소리만 아직 남아 있다.' },
  hunter:  { n: '그림자 사냥꾼',    g: 3, e: [['boss', .15], ['atk', .04]],    s: '그림자를 쫓다가, 어느 날 쫓기는 쪽이 되었다.' },
  king:    { n: '이름을 잃은 왕',   g: 4, e: [['atk', .08], ['hp', .08]],      s: '왕관만 남았다. 이름은 아래에서 누군가 삼켰다.' },
  saint:   { n: '잿불의 성녀',      g: 4, e: [['soul', .10], ['heal', .012], ['ash', .05]], s: '가장 먼저 내려온 사람. 그가 지핀 불이 아직 이 계단을 데운다.' }
};
const pvVal = (b, lv) => b * (1 + 0.4 * (lv - 1));
const pv = k => {
  let t = 0;
  for (let i = 0; i < S.eq.length; i++) {
    const p = PIL[S.eq[i]], lv = S.pil[S.eq[i]];
    if (!p || !lv) continue;
    for (let j = 0; j < p.e.length; j++) if (p.e[j][0] === k) t += pvVal(p.e[j][1], lv);
  }
  return t;
};
const effText = (id, lv) => PIL[id].e.map(([k, b]) => KIND[k].n + ' ' + KIND[k].f(pvVal(b, lv))).join(' · ');
const UP = {
  atk:   { name: '칼날', sub: '공격력',      base: 8,  g: 1.28, val: l => (3 + 2 * l) * ashM() * ALT.hand.val(S.meta.hand) * (1 + 0.35 * relLvl('blade')) * (1 + 0.6 * relLvl('pact')), show: v => fmt(v) },
  hp:    { name: '심지', sub: '최대 불꽃',   base: 10, g: 1.30, val: l => (40 + 15 * l) * ashM() * (1 + 0.3 * relLvl('wick')), show: v => fmt(v) },
  spd:   { name: '맥박', sub: '공격 속도',   base: 25, g: 1.42, val: l => (0.8 + 0.08 * l) * (1 + 0.3 * relLvl('fast')), show: v => v.toFixed(2) + '/초' },
  greed: { name: '탐식', sub: '영혼 획득',   base: 15, g: 1.36, val: l => (1 + 0.15 * l) * (1 + 0.05 * S.total) * ALT.eye.val(S.meta.eye) * (1 + 0.5 * relLvl('cup')), show: v => '×' + v.toFixed(2) },
  crit:  { name: '불티', sub: '치명타 확률', base: 20, g: 1.33, val: l => Math.min(0.6, 0.015 * l + ALT.spark.val(S.meta.spark) + 0.15 * relLvl('spark') + pv('crit')), show: v => (v * 100).toFixed(0) + '%' }
};
const critMult = () => 2 + 0.5 * relLvl('gambit');
const ALT = {
  auto:  { name: '자동 성장', sub: '가장 싼 성장을 알아서 산다', base: 12, g: 1, max: 1, val: l => l, show: v => (v ? '켜짐' : '꺼짐') },
  autoEnc: { name: '자동 선택', sub: '사건을 성향대로 알아서 고른다', base: 10, g: 1, max: 1, val: l => l, show: v => (v ? '켜짐' : '꺼짐') },
  autoRelic: { name: '자동 유물', sub: '유물이 나타나면 알아서 골라 준다', base: 10, g: 1, max: 1, val: l => l, show: v => (v ? '켜짐' : '꺼짐') },
  autoOpen: { name: '자동 개봉', sub: '유해를 얻는 즉시 알아서 연다', base: 8, g: 1, max: 1, val: l => l, show: v => (v ? '켜짐' : '꺼짐') },

function pickWeightedRelic(ids, w){
  let total = 0; for (const id of ids) total += w[RELICS[id].g - 1];
  let r = Math.random() * total;
  for (const id of ids) { const wt = w[RELICS[id].g - 1]; if (r < wt) return id; r -= wt; }
  return ids[ids.length - 1];
}

}

  S.ash += at; S.total += at;

  if (S.meta.autoEnc && S.encs.length) { encT += dt; if (encT >= ENC_AUTO) resolveEnc(0, S.stance ? 1 : 0); }
  else encT = 0;

  else relicT = 0;

}

/* ---------- 구매 ---------- */
function plan(d, l, cur, cap){
  if (!isFinite(l)) l = 0;
  let n = 0, sum = 0;
  while (n < cap && (d.max == null || l + n < d.max)) {
    if (d.val && d.val(l + n + 1) === d.val(l + n)) break;   // 다음 레벨을 사도 실제 값이 안 오르면(예: 치명타 60% 캡) 여기서 멈춘다
    const c = Math.ceil(d.base * Math.pow(d.g, l + n));
    if (sum + c > cur) break;
    sum += c; n++;
  }
  if (n === 0) {
    if (d.max != null && l >= d.max) return { n: 0, cost: 0, maxed: true };
    if (d.val && d.val(l + 1) === d.val(l)) return { n: 0, cost: 0, maxed: true };
    return { n: 0, cost: Math.ceil(d.base * Math.pow(d.g, l)) };
  }
  return { n, cost: sum };
}
const capOf = () => (mode === 1 ? 1 : mode === 10 ? 10 : 500);

function applyBuy(isUp, key, cap){
  const d = isUp ? UP[key] : ALT[key], lvs = isUp ? S.lv : S.meta;
  const p = plan(d, lvs[key], isUp ? S.souls : S.ash, cap);
  if (!p.n) return 0;
  if (isUp) S.souls -= p.cost; else S.ash -= p.cost;
  const before = maxHP();
  lvs[key] += p.n;
  if (isUp && key === 'hp') S.hp += maxHP() - before;
  return p.n;
}
function buy(isUp, key){
  if (!applyBuy(isUp, key, capOf())) return;
  sfx('buy');
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}

}
function autoBuy(){
  for (let i = 0; i < 3; i++) {
    let bk = null, bc = Infinity;
    for (const k in UP) {
      const p = plan(UP[k], S.lv[k], S.souls, 1);
      if (p.n && p.cost < bc) { bc = p.cost; bk = k; }
    }
    if (!bk) break;
    applyBuy(true, bk, 1);
  }
}

  const it = S.hl[slot], hv = wrap.querySelector('.hv');
  if (it) {
    const t = hlTier(it.tier);
    wrap.querySelector('.ic').style.setProperty('--tc', t.c);
    hv.className = 'hv'; hv.style.color = t.c;
    hv.textContent = t.n + ' · ' + KIND[HL_SLOTS[slot].k].f(it.val);
  } else {
    wrap.querySelector('.ic').style.setProperty('--tc', '#5a4a39');
    hv.className = 'hv empty'; hv.style.color = '';
    hv.textContent = '비어 있음';
  }
}
function updateHlSlots(){ Object.keys(HL_SLOTS).forEach(renderHlSlot); }
function hlOpenAll(){
  if (hlOpening || !S.hlQueue) return;
  hlOpening = true;
  const total = S.hlQueue;
  const reel = $('hlreel'); if (reel) reel.innerHTML = '';
  const gap = total > 30 ? 45 : total > 10 ? 70 : 110;
  const step = () => {
    if (!S.hlQueue) { hlOpening = false; save(); buildPanel(); return; }
    const it = hlItem(), ti = HL_TIERS.findIndex(t => t.k === it.tier);
    S.hlSeen[it.tier] = (S.hlSeen[it.tier] || 0) + 1;
    const got = hlTryEquip(it);
    S.hlQueue--;   // 한 개 깔 때마다 즉시 큐에서 제거 — 중간에 앱이 꺼져도 남은 개수가 그대로 보존된다(예전엔 시작할 때 통째로 0으로 비우고 끝나야만 저장해서, 애니메이션 도중 끊기면 나머지가 전부 사라졌다)
    if (reel) {
      const c = document.createElement('div');
      c.className = 'hlchip t' + (ti + 1);
      c.style.setProperty('--gc', HL_TIERS[ti].c);
      c.innerHTML = ICON[HL_SLOTS[it.slot].ic];
      c.title = HL_TIERS[ti].n + (got ? ' · 장착됨' : '');
      reel.appendChild(c);
    }
    sfx(ti >= 3 ? 'hlLegend' : ti >= 2 ? 'hlEpic' : ti >= 1 ? 'hlRare' : 'hlCommon');
    if (got) updateHlSlots();
    if (S.hlQueue % 5 === 0) save();   // 몇 개마다 한 번씩 중간 저장
    setTimeout(step, gap);
  };
  step();
}

function makeRow(isUp, key){
  const b = document.createElement('button'); b.className = 'card ' + (isUp ? 'up' : 'alt');
  b.style.setProperty('--tc', TC[key] || TC.relic);
  b.innerHTML = '<div class="ic">' + ICON[key] + '</div><div class="mid"><div class="nm"><span class="n"></span><span class="lv"></span></div><div class="ds"></div></div><div class="buy"><span class="c"></span><small></small></div>';
  b.onclick = () => buy(isUp, key);
  rows[key] = { el: b, isUp, n: b.querySelector('.n'), lv: b.querySelector('.lv'), ds: b.querySelector('.ds'), c: b.querySelector('.c'), s: b.querySelector('small') };
  return b;
}
function updatePanel(){
  Object.keys(rows).forEach(k => {
    const r = rows[k], d = r.isUp ? UP[k] : ALT[k], lvs = r.isUp ? S.lv : S.meta, l = lvs[k];
    const p = plan(d, l, r.isUp ? S.souls : S.ash, capOf());
    r.n.textContent = d.name;
    r.lv.textContent = d.max === 1 ? '' : d.max ? 'Lv ' + l + '/' + d.max : 'Lv ' + l;
    if (p.maxed) {
      r.ds.textContent = d.sub + ' — ' + d.show(d.val(l));
      r.c.textContent = '완료'; r.s.textContent = '';
      r.el.classList.remove('can'); r.el.classList.add('max');
      return;
    }
    r.ds.textContent = d.sub + ' ' + d.show(d.val(l)) + ' → ' + d.show(d.val(l + (p.n || 1)));
    r.el.classList.remove('max');
    r.c.textContent = fmt(p.cost);
    r.s.textContent = p.n > 1 ? '×' + p.n : '';
    r.el.classList.toggle('can', p.n > 0);
  });
  const nt = $('altnote');
  if (nt) nt.innerHTML = '불꽃이 꺼지면 재가 남는다. 재는 쓰더라도 누적된 만큼 모든 것을 강하게 한다.<br><b>누적 재 ' + fmt(S.total) + '</b> — 공격·체력 +' + fmt(S.total * 10) + '%, 영혼 +' + fmt(S.total * 5) + '%' +
    '<br><span style="color:#7d725f">자리를 비워도 최고기록층 기준으로 영혼·재가 계속 쌓인다 — "긴 잠"/"식지 않는 온기"로 쌓이는 시간과 효율이 늘어난다.</span>';
}

    $('etxt').textContent = E.name + ' ' + fmt(E.hp);
  } else {
    $('efill').style.transform = 'scaleX(0)';
    $('etxt').textContent = dead ? '' : '…';
  }
  $('t1').classList.toggle('ping', S.offers.length > 0);
  $('t3').classList.toggle('ping', S.encs.length > 0);
  $('t4').classList.toggle('ping', S.rems.length > 0 || (S.hlQueue || 0) > 0);
  const bf = $('buf');
  if (S.buf && !dead) { bf.textContent = BUFN[S.buf.k] + ' ×' + S.buf.m + ' · ' + S.buf.n; bf.classList.add('show'); }
  else bf.classList.remove('show');
  const ea = $('encauto');
  if (ea) ea.textContent = S.encs.length ? Math.max(0, Math.ceil(ENC_AUTO - encT)) + '초 뒤 ' + (S.stance ? '모험' : '안전') + ' 쪽으로 자동 선택' : '';
  const ra = $('relicauto');
  if (ra) ra.textContent = S.offers.length ? Math.max(0, Math.ceil(RELIC_AUTO - relicT)) + '초 뒤 자동으로 고른다' : '';
  $('t2').classList.toggle('ping', altAffordable());
  const bb = $('burn'), ready = !dead && !!E && burnT <= 0 && S.hp >= mx * 0.3;
  bb.disabled = !ready;
  bb.style.setProperty('--p', (burnT > 0 ? (1 - Math.min(1, burnT / burnCd())) * 100 : (S.hp < mx * 0.3 ? 0 : 100)) + '%');
  $('boss').classList.toggle('show', !!(E && E.boss));
  const eb = $('evt');
  if (S.evt) {
    eb.textContent = EVENTS[S.evt].n;
    eb.className = EVENTS[S.evt].c + ' show';
  } else {
    eb.classList.remove('show');
  }
  $('btxt').textContent = burnT > 0 ? Math.ceil(burnT) + '초' : '태우기';
  updatePanel();
}

/* ---------- 그리기 ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let cw = 360, ch = 220, dpr = 1;
const G = { hx: 90, hy: 120, gy: 170, ex: 270, bh: 80 };
function resize(){
  const r = $('stage').getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = r.width || 360; ch = r.height || 220;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}

function draw(dt, t){
  const W = cw, H = ch;
  const gy = H * 0.8, hx = W * 0.24, ex = W * 0.74;
  const mx = maxHP(), hpF = dead ? 0 : Math.max(0, Math.min(1, S.hp / mx));
  const candleH = 8 + H * 0.2 * hpF;
  const fs = (7 + 9 * hpF) * (1 + pulse);
  const hy = gy - candleH - fs * 1.1;
  const boss = !!(E && E.boss);
  const bh = H * 0.36 * (boss ? 1.5 : 1);
  const Z = zoneOf(S.floor), pal = Z ? Z.pal : DEFPAL;
  G.hx = hx; G.hy = hy; G.gy = gy; G.ex = ex; G.bh = bh;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  shake *= 0.86;

  /* 배경: 층마다 달라지는 기둥 */
  let sd = S.floor * 9301 + 49297;
  const rnd = () => { sd = (sd * 9301 + 49297) % 233280; return sd / 233280; };
  ctx.fillStyle = pal.pillar;
  const pcnt = Z ? Z.pc : 7;
  for (let i = 0; i < pcnt; i++) {
    const px = rnd() * W, pw = (12 + rnd() * 30) * (Z ? Z.pw : 1), ph = Math.min(gy, H * (0.35 + rnd() * 0.55) * (Z ? Z.ph : 1));
    ctx.fillRect(px, gy - ph, pw, ph);
  }
  ctx.fillStyle = pal.ground; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = pal.line; ctx.fillRect(0, gy, W, 1);

  /* 적 몸통 */
  if (E) {
    const bw = H * 0.17 * (boss ? 1.5 : 1);
    const x = ex - E.lunge * 38, bob = Math.sin(t * 2.1 + E.seed) * 3;
    ctx.beginPath();
    ctx.moveTo(x - bw, gy);
    ctx.bezierCurveTo(x - bw * 1.1, gy - bh * 0.6 + bob, x - bw * 0.6, gy - bh + bob, x, gy - bh + bob);
    ctx.bezierCurveTo(x + bw * 0.6, gy - bh + bob, x + bw * 1.1, gy - bh * 0.6 + bob, x + bw, gy);
    for (let i = 1; i <= 6; i++) {
      ctx.lineTo(x + bw - (2 * bw * i / 6), gy - (i % 2 ? bw * 0.35 : 0) + Math.sin(t * 3 + i) * 2);
    }
    ctx.closePath();
    ctx.fillStyle = E.flash > 0.05 ? '#9b8971' : pal.body;
    ctx.fill();
    ctx.strokeStyle = pal.stroke; ctx.lineWidth = 1; ctx.stroke();
    E.flash = Math.max(0, E.flash - dt * 6);
    E.lunge = Math.max(0, E.lunge - dt * 5);
  }

  /* 양초 */
  if (!dead || candleH > 0) {
    const cwid = 12;
    ctx.fillStyle = '#b9ad98';
    ctx.fillRect(hx - cwid / 2, gy - candleH, cwid, candleH);
    ctx.fillStyle = '#8f846f';
    ctx.fillRect(hx - cwid / 2, gy - candleH, 3, candleH);
    ctx.fillStyle = '#cfc4ae';
    ctx.beginPath(); ctx.ellipse(hx, gy - candleH, cwid / 2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9ad98';
    ctx.beginPath(); ctx.ellipse(hx + 6, gy - candleH + 7 + hpF * 5, 2, 5 + hpF * 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  /* 구역 색조 — 불빛이 닿는 곳에만 은은하게 깔린다 */
  if (Z) { ctx.fillStyle = 'rgba(' + Z.tint + ',' + Z.ta + ')'; ctx.fillRect(0, 0, W, H); }

  /* 어둠 — 빛의 반경은 불꽃의 양 */
  const fl = 1 + 0.07 * Math.sin(t * 17) + 0.05 * Math.sin(t * 29 + 1);
  const depthK = Math.max(0.55, 1 - S.floor * 0.008);
  const R = dead ? 28 : (44 + W * 0.62 * Math.pow(hpF, 0.8) * depthK) * (0.975 + 0.025 * fl);
  const dk = ctx.createRadialGradient(hx, hy, 0, hx, hy, R);
  dk.addColorStop(0, 'rgba(6,5,4,0)');
  dk.addColorStop(0.5, 'rgba(6,5,4,0.22)');
  dk.addColorStop(0.85, 'rgba(6,5,4,0.8)');
  dk.addColorStop(1, 'rgba(6,5,4,0.97)');
  ctx.fillStyle = dk; ctx.fillRect(-20, -20, W + 40, H + 40);

  /* 불꽃 */
  if (!dead) {
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, 70 * fl * (0.5 + hpF * 0.5));
    gr.addColorStop(0, 'rgba(233,162,79,0.38)'); gr.addColorStop(1, 'rgba(233,162,79,0)');
    ctx.fillStyle = gr; ctx.fillRect(hx - 90, hy - 90, 180, 180);
    ctx.globalCompositeOperation = 'source-over';

    const s = fs * fl, sway = Math.sin(t * 9) * s * 0.25 * (1 + (1 - hpF));
    ctx.beginPath();
    ctx.moveTo(hx, hy + s);
    ctx.bezierCurveTo(hx + s * 1.1, hy + s * 0.9, hx + s * 0.9, hy - s * 0.2, hx + sway, hy - s * 2.2);
    ctx.bezierCurveTo(hx - s * 0.9, hy - s * 0.2, hx - s * 1.1, hy + s * 0.9, hx, hy + s);
    const fg = ctx.createRadialGradient(hx, hy + s * 0.3, 0, hx, hy + s * 0.3, s * 1.5);
    fg.addColorStop(0, '#fff4d2'); fg.addColorStop(0.5, '#e9a24f'); fg.addColorStop(1, '#8a2f12');
    ctx.fillStyle = fg; ctx.fill();

    if (Math.random() < 0.7 * dt * 60 * (0.4 + hpF)) {
      P.push({ k: 'ember', x: hx + rint(-4, 4), y: hy - s * 1.5, vx: rint(-12, 12), vy: rint(-55, -20), life: rint(0.7, 1.5), max: 1.5, r: rint(0.8, 1.6) });
    }

    /* 유품 장식 — 지닌 것의 등급 색으로 불꽃 둘레를 도는 작은 빛. 순수 장식이고 능력치엔 영향 없다.
       크기·밝기는 최고기록층 구간(HL_FX_TIER)에 따라 달라진다 — 등급은 뽑기 운이지만,
       실제로 화려해 보이려면 그만큼 내려가 있어야 한다 */
    const hlOn = Object.keys(HL_SLOTS).filter(k => S.hl[k]);
    if (hlOn.length) {
      const fxT = HL_FX_TIER(S.best), fxM = HL_FX_MUL[fxT];
      ctx.globalCompositeOperation = 'lighter';
      hlOn.forEach((k, i) => {
        const tier = S.hl[k].tier, rgb = hexRgb(hlTier(tier).c).join(',');
        const rad = s * 1.6 + i * 5, a = t * (0.7 + i * 0.2) + i * (Math.PI * 2 / 3);
        const mx = hx + Math.cos(a) * rad, my = hy - s * 0.5 + Math.sin(a) * rad * 0.55;
        const orbR = 6 * fxM;
        const og = ctx.createRadialGradient(mx, my, 0, mx, my, orbR);
        og.addColorStop(0, 'rgba(' + rgb + ',' + Math.min(1, 0.9 * fxM) + ')'); og.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctx.fillStyle = og; ctx.beginPath(); ctx.arc(mx, my, orbR, 0, Math.PI * 2); ctx.fill();
        /* 고층(300층 이후)에서만, 영롱/전설 등급에 한해 반짝이는 불티가 추가로 튄다 */
        if (fxT === 2 && (tier === 'epic' || tier === 'legend') && Math.random() < 0.5 * dt * 60) {
          P.push({ k: 'hlspark', x: mx, y: my, vx: rint(-20, 20), vy: rint(-40, -10), life: rint(0.4, 0.9), max: 0.9, r: rint(0.8, 1.6), c: rgb });
        }
      });
      ctx.globalCompositeOperation = 'source-over';
    }
  } else if (Math.random() < 0.25) {
    P.push({ k: 'ash', x: hx, y: gy - candleH, vx: rint(-6, 6), vy: rint(-30, -14), life: 2, max: 2, r: 1.6 });
  }

  /* 적의 눈 — 어둠 속에서도 보인다 */
  if (E) {
    const bob = Math.sin(t * 2.1 + E.seed) * 3, x = ex - E.lunge * 38;
    const n = E.boss ? 5 : 2 + (E.tier >= 2 ? 1 : 0) + (E.tier >= 4 ? 1 : 0);
    const spread = H * 0.17 * (E.boss ? 1.5 : 1) * 0.65;
    const eyeY = gy - bh * 0.62 + bob;
    const blink = Math.sin(t * 1.7 + E.seed * 7) > 0.97 ? 0.15 : 1;
    const col = Z ? (E.boss ? Z.boss : Z.eye) : (E.boss ? '239,230,211' : '255,90,70');
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const ox = n > 1 ? (i - (n - 1) / 2) * (spread * 2 / (n - 1)) : 0;
      const oy = E.boss ? -Math.abs(i - (n - 1) / 2) * 5 : 0;
      const r = (E.boss ? 3.2 : 2.4) * blink;
      const eg = ctx.createRadialGradient(x + ox, eyeY + oy, 0, x + ox, eyeY + oy, r * 5);
      eg.addColorStop(0, 'rgba(' + col + ',0.75)'); eg.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = eg; ctx.fillRect(x + ox - r * 5, eyeY + oy - r * 5, r * 10, r * 10);
      ctx.fillStyle = 'rgb(' + col + ')';
      ctx.beginPath(); ctx.arc(x + ox, eyeY + oy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 구역 분위기 — 어둠 속에서도 보이는 것: 적의 기운, 지평선, 떠다니는 먼지 */
  if (Z) {
    if (E && !dead) {
      const ac = E.boss ? Z.boss : Z.eye, ax = ex - E.lunge * 38, ay = gy - bh * 0.55, ar = H * (E.boss ? 0.62 : 0.42);
      ctx.globalCompositeOperation = 'lighter';
      const ag = ctx.createRadialGradient(ax, ay, 0, ax, ay, ar);
      ag.addColorStop(0, 'rgba(' + ac + ',' + (E.boss ? 0.16 : 0.10) + ')'); ag.addColorStop(1, 'rgba(' + ac + ',0)');
      ctx.fillStyle = ag; ctx.fillRect(ax - ar, ay - ar, ar * 2, ar * 2);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillStyle = 'rgba(' + Z.tint + ',0.22)'; ctx.fillRect(0, gy, W, 1);
    if (!RM && P.length < 300 && Math.random() < dt * 3) {
      const up = Z.dust.vy < 0;
      P.push({ k: 'dust', c: Z.dust.c, x: Math.random() * W, y: up ? H * 0.98 : -4, vx: rint(-6, 6), vy: Z.dust.vy * (0.6 + Math.random() * 0.8), life: 3 + Math.random() * 3, r: 0.8 + Math.random() * 1.4 });
    }
  }

  /* 파티클 */
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (p.k === 'ember' || p.k === 'ash' || p.k === 'hlspark') {
      p.life -= dt; if (p.life <= 0) { P.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === 'ash') { p.vx *= 0.98; p.vy += 25 * dt; }
      const a = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.k === 'ember' ? 'rgba(255,190,100,' + a + ')' : p.k === 'hlspark' ? 'rgba(' + p.c + ',' + a + ')' : 'rgba(150,140,125,' + a * 0.8 + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (p.k === 'dust') {
      p.life -= dt; if (p.life <= 0 || p.y < -8 || p.y > H + 8) { P.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.fillStyle = 'rgba(' + p.c + ',' + (Math.min(1, p.life / 1.2) * 0.5) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (p.k === 'mote') {
      p.t += dt / 0.65;
      if (p.t < 0) continue;
      if (p.t >= 1) { pulse = Math.min(0.35, pulse + 0.05); P.splice(i, 1); continue; }
      const u = p.t, v = 1 - u;
      const x = v * v * p.sx + 2 * v * u * p.cx + u * u * hx;
      const y = v * v * p.sy + 2 * v * u * p.cy + u * u * hy;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,214,140,0.9)';
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,190,100,0.25)';
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.k === 'bolt') {
      p.t += dt / p.life;
      if (p.t >= 1) { P.splice(i, 1); continue; }
      const x = p.x + (p.tx - p.x) * p.t, y = p.y + (p.ty - p.y) * p.t;
      const x0 = p.x + (p.tx - p.x) * Math.max(0, p.t - 0.35), y0 = p.y + (p.ty - p.y) * Math.max(0, p.t - 0.35);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.tap ? 'rgba(255,245,220,0.95)' : 'rgba(255,200,120,0.85)';
      ctx.lineWidth = p.tap ? 3 : 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (P.length > 400) P.splice(0, P.length - 400);
  pulse *= Math.pow(0.02, dt);

  /* 떠오르는 숫자 */
  ctx.textAlign = 'center';
  for (let i = F.length - 1; i >= 0; i--) {
    const f = F[i];
    if (f.d > 0) { f.d -= dt; continue; }
    f.life -= dt; if (f.life <= 0) { F.splice(i, 1); continue; }
    f.y += f.vy * dt;
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = '400 ' + (f.s + 2) + 'px "Do Hyeon","Noto Sans KR",sans-serif';
    ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#1a0f06';
    ctx.strokeText(f.t, f.x, f.y);
    ctx.fillStyle = f.c; ctx.fillText(f.t, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  if (F.length > 60) F.splice(0, F.length - 60);

  ctx.restore();

  /* 태우기 섬광 */
  if (flare > 0) {
    ctx.fillStyle = 'rgba(255,214,140,' + flare * 0.22 + ')'; ctx.fillRect(0, 0, W, H);
    flare = Math.max(0, flare - dt * 3);
  }

  /* 구역 진입 배너 */
  if (zoneBanner) {
    zoneBanner.t += dt;
    const bt = zoneBanner.t;
    if (bt > 3.4) zoneBanner = null;
    else {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, bt * 2.5, (3.4 - bt) * 2));
      ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0a0908';
      ctx.font = '400 22px "Do Hyeon","Noto Sans KR",sans-serif'; ctx.lineWidth = 4;
      ctx.strokeText(zoneBanner.n, W / 2, H * 0.24); ctx.fillStyle = 'rgb(' + zoneBanner.c + ')'; ctx.fillText(zoneBanner.n, W / 2, H * 0.24);
      ctx.font = '400 12px "Do Hyeon","Noto Sans KR",sans-serif'; ctx.lineWidth = 3;
      ctx.strokeText(zoneBanner.sub, W / 2, H * 0.24 + 20); ctx.fillStyle = '#b9ad98'; ctx.fillText(zoneBanner.sub, W / 2, H * 0.24 + 20);
      ctx.restore();
    }
  }

  /* 피격 플래시 */
  if (heroFlash > 0) {
    ctx.fillStyle = 'rgba(178,53,43,' + heroFlash * 0.28 + ')'; ctx.fillRect(0, 0, W, H);
    heroFlash = Math.max(0, heroFlash - dt * 4);
  }

  /* 처치 진행 점 */
  const nk = need(S.floor);
  for (let i = 0; i < nk; i++) {
    ctx.beginPath(); ctx.arc(22 + i * 12, 20, nk === 1 ? 5 : 3.2, 0, Math.PI * 2);
    if (i < S.kills) { ctx.fillStyle = '#e9a24f'; ctx.fill(); }
    else { ctx.strokeStyle = nk === 1 ? '#b2352b' : '#4a4136'; ctx.lineWidth = 1; ctx.stroke(); }
  }
}

/* ---------- 카카오 로그인 (뼈대) ----------
   서버 없이 카카오 계정으로만 닉네임을 확인하는 단계까지만 구현한다.
   로그인 성공 시 access_token을 localStorage에 저장해두고, 페이지를 새로 열 때
   그 토큰이 아직 유효하면 자동으로 재로그인한다(팝업 없이 조용히). 카카오 SDK
   access_token은 보통 몇 시간 정도만 유효하니, 그 이상 지나면 결국 다시 로그인 버튼을
   눌러야 한다 — 이건 서버 세션이 아니라 토큰 유효기간의 한계라 어쩔 수 없다. */
const KAKAO_JS_KEY = 'e0c53db58ced481c2e383fe128e99724';   // 카카오 디벨로퍼스 > 내 애플리케이션 > 앱 키 > JavaScript 키
const KAKAO_TOKEN_LS_KEY = 'emberKakaoToken';
let kakaoReady = false, kakaoUser = null;
try {
  if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
  kakaoReady = !!(window.Kakao && Kakao.isInitialized() && KAKAO_JS_KEY !== 'YOUR_KAKAO_JAVASCRIPT_KEY');
} catch (e) { kakaoReady = false; }
function saveKakaoToken(){
  try { localStorage.setItem(KAKAO_TOKEN_LS_KEY, Kakao.Auth.getAccessToken() || ''); } catch (e) {}
}
function clearKakaoToken(){
  try { localStorage.removeItem(KAKAO_TOKEN_LS_KEY); } catch (e) {}

function tryRestoreKakaoSession(){
  // Promise를 반환한다: 접속자 수(presence) 연결이 로그인 여부가 확정된 뒤에
  // 시작되도록 하기 위함. kakaoUser는 afterKakaoLogin의 동기 구간에서 바로
  // 세팅되므로, resolve 시점엔 이미 올바른 kakao id를 알 수 있다.
  return new Promise((resolve) => {
    if (!kakaoReady) return resolve();
    let saved = null;
    try { saved = localStorage.getItem(KAKAO_TOKEN_LS_KEY); } catch (e) {}
    if (!saved) return resolve();
    try { Kakao.Auth.setAccessToken(saved); } catch (e) { clearKakaoToken(); return resolve(); }
    Kakao.API.request({
      url: '/v2/user/me',
      async success(res){ await afterKakaoLogin(res); resolve(); },
      fail(){ clearKakaoToken(); try { Kakao.Auth.setAccessToken(null); } catch (e) {} resolve(); }
    });
  });
}

/* ---------- 길드 ----------

   가입·생성·탈퇴·추방·공지 변경·기부처럼 "쓰는" 동작만 profile-sync Edge Function을 거쳐
   카카오 토큰으로 신원을 확인한 뒤 서버 롤 키로 처리한다(닉네임/채팅과 같은 원칙).
   ⚠ 서버(profile-sync)에 guild_create / guild_join / guild_leave / guild_kick /
      guild_set_notice / guild_donate 액션 추가가 필요하다 — 아래 GUILD_SETUP.md 참고.
      guild_donate는 { tier: 'small'|'medium' }을 받아 서버가 정해진 금액(100/300)만큼
      guilds.donated += amount 로 누적한다 — 자유 입력 금액은 받지 않고, 하루 3회 제한도
      서버(guild_members.donate_count/donate_date)가 최종 판정한다.
      guilds 테이블에 donated bigint not null default 0 컬럼, guild_members 테이블에
      donate_count integer default 0 / donate_date date / donated bigint default 0
      (길드원별 누적 기부량 — 길드원 목록에 정렬·표시용) 컬럼 추가 필요. */
const GUILD_TABLE = 'guilds';
const GUILD_MEMBERS_TABLE = 'guild_members';
const GUILD_LIST_N = 30;
const GUILD_MAX_MEMBERS = 20;   // 길드 최대 인원 — 서버(guild_join)도 같은 값으로 막아야 한다(클라 검사는 UX용, 우회 가능)

/* 길드 가입 여부가 확정되기 전엔(fetchMyGuild가 아직 응답 전) guildBuff()가 무조건 0으로 계산된다.
   특히 부재중 보상(checkAway)은 페이지를 여는 즉시 동기적으로 실행되는데, 그 시점엔 로그인 복원+길드
   조회가 아직 네트워크 왕복 중이라 길드원이어도 버프 없이 계산돼버리는 문제가 있었다 — 아래 플래그/프로미스로
   "길드 여부가 확정될 때까지" 부재중 보상 계산 자체를 미룬다. */
let guildLoaded = false, resolveGuildReady;
const guildReadyPromise = new Promise(res => { resolveGuildReady = res; });
function markGuildLoaded(){ if (!guildLoaded) { guildLoaded = true; resolveGuildReady(); } }
setTimeout(markGuildLoaded, 4000);   // 네트워크가 느리거나 비로그인 상태여도 화면이 무한정 멈추지 않도록 하는 안전장치

async function fetchMyGuild(){
  if (!sbClient || !kakaoUser) { myGuild = null; myGuildRole = null; markGuildLoaded(); return; }
  try {
    const { data, error } = await sbClient
      .from(GUILD_MEMBERS_TABLE)
      .select('role,guilds(id,name,notice,leader_kakao_id,member_count,donated)')
      .eq('kakao_id', String(kakaoUser.id))
      .maybeSingle();
    if (error) throw error;   // 조회 실패(네트워크 등)는 "길드 없음"이 아니다 — 이전 상태를 그대로 둔다
    if (!data || !data.guilds) { myGuild = null; myGuildRole = null; }
    else { myGuild = data.guilds; myGuildRole = data.role; }
  } catch (e) { /* 이전 길드 상태 유지 — 여기서 null로 만들면 버프·길드 채팅 탭이 잠깐의 오류로 사라진다 */ }

async function submitGuildModal(){
  const raw = $('gmInput').value.trim();
  if (guildModalMode === 'create') {
    if (raw.length < 2 || raw.length > 12 || /\s/.test(raw)) { $('gmErr').textContent = '2~12자, 공백 없이 입력해줘.'; return; }
    if (containsProfanity(raw)) { $('gmErr').textContent = '이름에 부적절한 표현이 있다.'; return; }
    $('gmSave').disabled = true;
    const r = await callProfileSync('guild_create', { name: raw });
    if (!r || r.error) {
      $('gmErr').textContent = r && r.error === 'taken' ? '이미 있는 길드 이름이다.' : r && r.error === 'already_in_guild' ? '이미 다른 길드에 속해 있다.' : '만들지 못했다. 다시 시도해줘.';
      $('gmSave').disabled = false;
      return;
    }
    closeGuildModal();
    CHAT.notice('"' + raw + '" 길드를 만들었다.');
    await fetchMyGuild(); renderGuildView();
  } else {
    if (raw.length > 60) { $('gmErr').textContent = '60자 이내로 입력해줘.'; return; }
    $('gmSave').disabled = true;
    const r = await callProfileSync('guild_set_notice', { notice: raw });
    if (!r || r.error) { $('gmErr').textContent = '저장하지 못했다.'; $('gmSave').disabled = false; return; }
    myGuild.notice = raw;
    closeGuildModal();
    renderGuildDetail();
  }
}

  if (guildDonateCountToday() >= GUILD_DONATE_DAILY_LIMIT) { CHAT.notice('오늘 기부 횟수를 다 썼다.'); return; }

    const todayKst = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

}

const BAD_WORDS_KO = [
  '씨발','시발','씨팔','시팔','씨바','ㅅㅂ','ㅆㅂ','병신','ㅄ','ㅂㅅ',
  '좆','좇','좆같','개새끼','개새꺄','개색기','새끼','씹','씹새끼','씹치',
  '지랄','존나','ㅈㄴ','느금마','느그애비','미친놈','미친년','걸레','창녀',
  '애미','후장','자지','보지','fuck','fucking','shit','bitch','asshole'
];
function normFilter(s){ return String(s || '').replace(/\s+/g, ''); }
function containsProfanity(text){
  const norm = normFilter(text).toLowerCase();
  return BAD_WORDS_KO.some(w => norm.includes(w.toLowerCase()));
}
function maskProfanity(text){
  let out = text;
  BAD_WORDS_KO.forEach(w => {
    if (!w) return;
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(esc, 'gi'), m => '*'.repeat(m.length));
  });
  return out;
}
const CN = ['#e9a24f', '#6fb3a8', '#a98be0', '#d0603f', '#7fa3d6', '#c9b99a'];

const CHAT = {
  msgs: [], unread: 0, open: false, status: 'offline', transport: null, lastSend: 0, noticed: false,
  MAX: 100, COOL: 1000, KEEP: 80,
  me(){ if (kakaoUser) return kakaoUser.nick; if (!S.nick) S.nick = '순례자' + (1000 + Math.floor(Math.random() * 9000)); return S.nick; },
  add(m, quiet){
    if (m.id && CHAT.msgs.some(x => x.id === m.id)) return;
    CHAT.msgs.push(m); if (CHAT.msgs.length > CHAT.KEEP) CHAT.msgs.shift();
    const list = $('cl');
    const near = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    list.appendChild(chatLine(m));
    while (list.children.length > CHAT.KEEP) list.removeChild(list.firstChild);

    if (!quiet && !CHAT.open && !m.me && !m.sys) { CHAT.unread++; $('chatbtn').classList.add('ping'); }
  },
  notice(text){ CHAT.add({ sys: true, text }, true); },

    const now = Date.now();
    if (now - CHAT.lastSend < CHAT.COOL) { CHAT.notice('잠시 후에 다시 말할 수 있다.'); return false; }
    CHAT.lastSend = now;
    const m = { id: now.toString(36) + Math.random().toString(36).slice(2, 6), name: CHAT.me(), text, me: true };
    CHAT.add(m);
    if (CHAT.transport) { try { CHAT.transport.send(m); } catch (e) { CHAT.notice('보내지 못했다.'); } }
    else if (!CHAT.noticed) { CHAT.noticed = true; CHAT.notice('서버에 연결되지 않아 이 기기에서만 보인다.'); }
    return true;
  }
};

/* ---------- 부재 중 보상 / 저장 ---------- */
async function checkAway(){
  const el = (Date.now() - S.lastSeen) / 1000;
  S.lastSeen = Date.now();   // 경과 시간 측정은 길드 조회를 기다리지 않고 그 자리에서 바로 찍는다 — 여기서 지연되면 시간 계산 자체가 틀어진다
  if (el < 5) return;
  if (!guildLoaded) await guildReadyPromise;   // 길드 버프가 0으로 확정되기 전에는(로딩 중) 보상을 계산하지 않는다
  const capH = ALT.away.val(S.meta.away), eff = ALT.awayEff.val(S.meta.awayEff);
  const capped = Math.min(el, capH * 3600);
  let rate = S.sps;
  if (!rate) {
    // sps가 아직 없으면(막 시작했거나 오래 쉬었으면) 최고기록층 기준으로 이론치를 추정
    const kps = apsV() / need(S.best);
    const avgSoul = soulBase(S.best) * soulM();
    rate = kps * avgSoul;
  }
  const g = Math.max(1, Math.round(rate * capped * eff));
  S.souls += g;
  const ashRate = ashGain(S.best) * ASH_AWAY_FRAC / 3600;
  const ga = Math.max(0, Math.round(ashRate * capped * eff));
  if (ga > 0) { S.ash += ga; S.total += ga; }
  const hq = Math.max(0, Math.floor(HL_AWAY_RATE(S.best) * (capped / 3600) * eff));
  if (hq > 0) addHlQueue(hq);
  const dur = t => { const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60); return h ? h + '시간' + (m ? ' ' + m + '분' : '') : Math.max(1, m) + '분'; };
  const msg = dur(el) + ' 만에 돌아왔다 — 영혼 ' + fmt(g) + '개' + (ga > 0 ? ' · 재 ' + fmt(ga) + '개' : '') + (hq > 0 ? ' · 유품 +' + fmt(hq) + '개' : '') + (el > capped + 1 ? ' (최대 ' + capH + '시간까지 쌓인다)' : '');
  say(msg, 'gold');
  showAway(msg);
  ui(); save();
}
let awayHideT = null;
function showAway(t){
  const el = $('away');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(awayHideT);
  awayHideT = setTimeout(() => el.classList.remove('show'), 4500);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (isLeader) { S.lastSeen = Date.now(); save(); } return; }   // 화면을 벗어나는 순간을 정확히 찍어 둔다 (대표 탭일 때만)
  if (!isLeader) { claimOrWait(); return; }   // 팔로워였다면 그새 다른 탭이 닫혔는지 다시 확인
  checkAway(); last = performance.now(); ui(); if (AC && AC.state !== 'running') AC.resume();
});
window.addEventListener('pagehide', () => { if (!isLeader) return; if (!document.hidden) S.lastSeen = Date.now(); save(); touchProfile(); });
window.addEventListener('beforeunload', () => { if (!isLeader) return; if (!document.hidden) S.lastSeen = Date.now(); save(); touchProfile(); });
setInterval(() => { if (!isLeader) return; if (!document.hidden) S.lastSeen = Date.now(); save(); }, 5000);   // 보고 있는 동안엔 계속 '방금'으로 갱신 — 새로고침해도 이미 번 시간을 또 자리비움으로 안 쳐준다
setInterval(() => { if (!isLeader) return; if (!document.hidden) touchProfile(); }, 20000);   // 로그인한 유저의 진행도를 20초마다 서버에 반영
setInterval(ui, 100);

/* ---------- 새 버전 배포 감지 ----------
   별도 version.json 없이, 서버가 보내는 index.html의 ETag/Last-Modified가
   배포될 때마다 자동으로 바뀌는 걸 이용한다. 화면을 보고 있을 땐 배너만 띄우고,
   안 보고 있을 때(탭 전환/백그라운드)만 조용히 새로고침한다. */
const UPD_CHECK_MS = 60000;
let pageSig = null, updAvailable = false, updChecking = false;
function silentReload(){                    // 유저가 직접 누른 게 아니라 조용히 적용되는 새로고침
  try { sessionStorage.setItem('updJustApplied', '1'); } catch (e) {}
  location.reload();
}
async function fetchPageSig(){
  // 서명은 항상 'e:'(ETag/Last-Modified) 또는 'b:'(본문) 접두사를 붙여 종류를 구분한다.
  // 실패/에러 응답이면 null → 이번 체크는 건너뜀 (형식이 섞여 오탐하는 걸 방지)
  try {
    const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
    if (!res.ok) return null;
    let tag = res.headers.get('etag');
    if (tag) return 'e:' + tag.replace(/^W\//, '');   // 약한 ETag 접두사(W/)는 CDN이 붙였다 뗐다 하므로 제거
    tag = res.headers.get('last-modified');
    if (tag) return 'e:' + tag;
  } catch (e) { return null; }
  try {
    // HEAD는 정상인데 ETag/Last-Modified가 아예 없는 서버 대비
    const res = await fetch(location.href, { cache: 'no-store' });
    if (!res.ok) return null;
    const text = await res.text();
    return 'b:' + text.length + ':' + text.slice(0, 300);
  } catch (e) { return null; }
}
let pendingSig = null;
async function checkForUpdate(){
  if (updChecking || updAvailable) return;
  if (navigator.onLine === false) return;             // 복귀 직후 네트워크 미준비 상태는 건너뜀
  updChecking = true;
  const sig = await fetchPageSig();
  updChecking = false;
  if (!sig) return;
  if (pageSig === null) { pageSig = sig; return; }   // 최초 확인은 기준값만 저장
  if (sig[0] !== pageSig[0]) return;                  // 서명 종류가 다르면 비교하지 않음
  if (sig === pageSig) { pendingSig = null; return; } // 원래 값으로 돌아오면(CDN 엣지 왔다갔다) 무시
  // 다른 값이 감지됨: 같은 새 값이 두 번 연속 나올 때만 진짜 배포로 인정
  if (pendingSig !== sig) { pendingSig = sig; setTimeout(checkForUpdate, 15000); return; }
  updAvailable = true;
  if (document.hidden) silentReload();                // 아무도 안 보고 있으면 조용히 적용
  else $('upd').classList.add('show');                // 보고 있으면 배너만
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && updAvailable) silentReload();       // 배너를 무시하다가 화면을 벗어나는 순간 적용
});
$('updBtn').onclick = () => location.reload();
setInterval(checkForUpdate, UPD_CHECK_MS);
checkForUpdate();
try {
  if (sessionStorage.getItem('updJustApplied')) {     // 이 탭에서 방금 조용히 새로고침됐던 경우에만 한 번 안내
    sessionStorage.removeItem('updJustApplied');
    $('updDone').classList.add('show');
    setTimeout(() => $('updDone').classList.remove('show'), 3000);
  }
} catch (e) {}

/* ---------- 여러 탭 동시 실행 방지 ----------
   같은 브라우저에서 이 게임을 두 탭(또는 창) 이상 열면 각 탭이 저장된 상태를 따로 불러와
   독립적으로 진행한다. 그러면 (1) 방치 보상이 탭마다 각자 계산되어 두 배로 들어오거나,
   (2) 나중에 저장하는 탭이 다른 탭의 진행을 통째로 덮어써 버리는 문제가 생긴다.
   localStorage에 '지금 주도권을 쥔 탭'을 심박(heartbeat)으로 남겨서, 이미 살아있는 심박이
   있으면 이 탭은 차단막을 띄우고 게임 루프(프레임/저장/방치보상)를 멈춘 채 기다린다. */
const TAB_ID = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LOCK_KEY = KEY + ':lock';
const LOCK_TTL = 12000, LOCK_HEARTBEAT = 4000, LOCK_POLL = 3000;
let isLeader = false, began = false, lockHeartbeatT = null, pendingClaim = false;
function readLock(){ try { return JSON.parse(localStorage.getItem(LOCK_KEY)); } catch (e) { return null; } }
function writeLock(){ try { localStorage.setItem(LOCK_KEY, JSON.stringify({ id: TAB_ID, ts: Date.now() })); } catch (e) {} }
function lockStale(l){ return !l || !l.id || !isFinite(l.ts) || Date.now() - l.ts > LOCK_TTL; }
function beginPlay(){        // 대표 탭이 될 때(최초 1회, 또는 나중에 다시 주도권을 잡았을 때) 실제 게임을 진행시킨다
  if (!began) {
    began = true;
    if (fresh) {
      newRun();
      say('어둠 속에서 눈을 뜬다. 손에는 작은 불꽃뿐.');
      say('화면을 누르면 불꽃이 날아간다. 가운데 버튼은 불꽃을 태워 일격을 가한다.');
      buildPanel(); ui();
      return;
    }
  }
  checkAway().then(() => say('다시 어둠 속. 불꽃은 아직 타고 있다.'));
}
function becomeLeader(){
  isLeader = true;
  writeLock();
  clearInterval(lockHeartbeatT);
  lockHeartbeatT = setInterval(writeLock, LOCK_HEARTBEAT);
  $('tablock').classList.remove('show');
  beginPlay();
}
function becomeFollower(){
  if (isLeader) { isLeader = false; clearInterval(lockHeartbeatT); }
  $('tablock').classList.add('show');
}
function claimOrWait(){
  if (isLeader || pendingClaim) return;
  const l = readLock();
  if (!lockStale(l)) { becomeFollower(); return; }
  // 락이 비어 보여도 곧바로 대표로 확정하지 않는다 — 여러 탭이 정말 동시에 뜬 경우
  // 다들 똑같이 '비어있다'고 읽어버릴 수 있어서, 일단 내 이름으로 표시만 해두고 잠깐 기다렸다가
  // 그 사이 아무도 안 덮어썼을 때만 확정한다(동시에 여럿이 써도 마지막에 쓴 것만 남는다).
  pendingClaim = true;
  writeLock();
  setTimeout(() => {
    pendingClaim = false;
    const check = readLock();
    if (check && check.id === TAB_ID) becomeLeader(); else becomeFollower();
  }, 200);
}
window.addEventListener('storage', e => {   // 다른 탭이 심박을 새로 남기는 순간이 바로 이 이벤트로 들어온다(내가 쓴 건 안 옴)
  if (e.key !== LOCK_KEY) return;
  const l = readLock();
  if (isLeader && l && l.id !== TAB_ID && !lockStale(l)) becomeFollower();
});
setInterval(() => { if (!isLeader) claimOrWait(); }, LOCK_POLL);   // 대기 중엔 다른 탭이 닫혔는지 주기적으로 재확인
$('tlRetry').onclick = claimOrWait;
$('tlForce').onclick = () => becomeLeader();   // 굳이 무릅쓰고 이어하겠다는 명시적 선택 — 진행이 겹칠 수 있다고 이미 안내했다

/* ---------- 시작 ---------- */
if (!fresh) {
  if (!Array.isArray(S.relics)) S.relics = [];
  if (!Array.isArray(S.offers)) S.offers = [];
  if (!Array.isArray(S.metRelics)) S.metRelics = [];
  S.metRelics = S.metRelics.filter((id, i, a) => RELICS[id] && a.indexOf(id) === i);
  if (!Array.isArray(S.eng)) S.eng = [];
  S.eng = S.eng.filter((id, i, a) => RELICS[id] && S.metRelics.indexOf(id) >= 0 && a.indexOf(id) === i).slice(0, ALT.eng.val(S.meta.eng));
  if (!S.pil || typeof S.pil !== 'object' || Array.isArray(S.pil)) S.pil = {};
  Object.keys(S.pil).forEach(k => { if (!PIL[k] || !(S.pil[k] >= 1)) delete S.pil[k]; else S.pil[k] = Math.min(PIL_MAX, Math.floor(S.pil[k])); });
  if (!Array.isArray(S.eq)) S.eq = [];
  S.eq = S.eq.filter((id, i, a) => S.pil[id] && a.indexOf(id) === i).slice(0, slotN());
  if (!Array.isArray(S.rems)) S.rems = [];
  S.rems = S.rems.filter(o => o && isFinite(o.f)).slice(0, REM_CAP);
  if (!isFinite(S.pity)) S.pity = 0;
  if (!S.hl || typeof S.hl !== 'object' || Array.isArray(S.hl)) S.hl = { hand: null, neck: null, chest: null };
  Object.keys(HL_SLOTS).forEach(s => { const it = S.hl[s]; if (it && (!HL_SLOTS[it.slot] || !isFinite(it.val))) S.hl[s] = null; if (!S.hl.hasOwnProperty(s)) S.hl[s] = null; });
  if (!isFinite(S.hlQueue) || S.hlQueue < 0) S.hlQueue = 0;
  else if (S.hlQueue > HL_QUEUE_CAP) S.hlQueue = HL_QUEUE_CAP;
  if (!S.hlSeen || typeof S.hlSeen !== 'object') S.hlSeen = {};
  HL_TIERS.forEach(t => { if (!isFinite(S.hlSeen[t.k])) S.hlSeen[t.k] = 0; });
  if (!Array.isArray(S.encs)) S.encs = [];
  S.encs = S.encs.filter(e => e && ENC[e.id] && isFinite(e.f));
  if (S.buf && !(BUFN[S.buf.k] && S.buf.n > 0 && isFinite(S.buf.m))) S.buf = null;
  S.hp = Math.max(1, Math.min(S.hp, maxHP()));
  if (S.hp <= 1) S.hp = maxHP();
}
$('snd').textContent = VLB[S.vol];
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
buildPanel(); ui();

let last = performance.now(), acc = 0;
function frame(now){
  if (!isLeader) { last = now; requestAnimationFrame(frame); return; }   // 팔로워 탭은 시뮬레이션을 완전히 멈춘다 — 화면도 차단막에 가려져 있다
  let raw = (now - last) / 1000; last = now;
  if (raw > 3) checkAway();   // 프레임 간격이 크게 벌어졌다면(탭 전환 등) 부재 보상을 여기서도 확인
  let dt = Math.min(raw, 0.25);
  acc += dt;
  while (acc >= 0.05) { update(0.05); acc -= 0.05; }
  draw(dt, now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
claimOrWait();   // 대표 탭이면 곧바로 시작(beginPlay), 아니면 차단막을 띄우고 기다린다
})();
</script>
</body>
