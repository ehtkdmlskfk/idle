<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잿불</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  --void:#0a0908; --well:#100d0a; --line:#2a241d; --dim:#8a7e6e; --bone:#e2d8c6;
  --ember:#e9a24f; --hot:#ffe3a6; --blood:#b2352b;
  --ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --disp:'Do Hyeon','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --lore:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--void:#0a0908;--bone:#e2d8c6}}
:root[data-theme="dark"]{--void:#0a0908;--bone:#e2d8c6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--void)}
*{box-sizing:border-box}
body{
  height:100%;margin:0;color:var(--bone);
  background:radial-gradient(120% 55% at 50% 0%,#1e150d 0%,var(--void) 65%);
  font-family:var(--ui);line-height:1.45;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-variant-numeric:tabular-nums;
}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* 상단: 층 + 재화 */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px 8px}
.floor{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:4px;min-width:0}
.floor b{display:inline-block;font-family:var(--disp);font-weight:400;font-size:52px;line-height:1;color:var(--hot);
  text-shadow:0 3px 0 #7a3a10,0 0 22px rgba(233,162,79,.45)}
.floor b.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
.floor .u{font-family:var(--disp);font-size:20px;color:var(--ember)}
.floor small{flex-basis:100%;font-size:11px;color:var(--dim);white-space:nowrap}
.wallet{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:6px;min-width:120px;padding:3px 10px 3px 4px;border-radius:999px;
  background:linear-gradient(#0b0907,#171310);border:1px solid #3a2f22;box-shadow:inset 0 1px 3px #000}
.pill .coin{flex:none;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1c4,#e9a24f 55%,#8a4a14);box-shadow:0 0 0 1px #4a2a0c}
.pill.ash .coin{background:radial-gradient(circle at 35% 30%,#f1eadc,#9a8f7c 55%,#4a4136);box-shadow:0 0 0 1px #2a241d}
.pill .lb{font-size:11px;color:var(--dim)}
.pill b{margin-left:auto;font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.2;color:var(--bone)}
.pill em{font-style:normal;font-size:11px;font-weight:700;color:var(--ember)}

/* 전투 화면 */
#stage{position:relative;margin:0 12px;height:clamp(170px,28vh,240px);border-radius:18px;border:2px solid #3a2f22;overflow:hidden;background:#0a0908;
  box-shadow:0 0 0 1px #000,0 6px 18px rgba(0,0,0,.6),inset 0 0 26px rgba(0,0,0,.55)}
#cv{display:block;width:100%;height:100%}
.hud{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--disp);font-size:13px;color:#5a4a39;letter-spacing:.2em;pointer-events:none}
.snd{min-height:28px;padding:4px 10px;border-radius:999px;border:1px solid #3a2f22;background:rgba(10,9,8,.55);color:var(--dim);font-size:11px}
#boss{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;
  padding:2px 12px;border-radius:999px;font-family:var(--disp);font-size:14px;color:#ffe3dc;
  background:linear-gradient(#c4402f,#7a1f16);border:1px solid #e07a6b;box-shadow:0 2px 0 #40100b,0 0 14px rgba(196,64,47,.5);
  transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#boss.show{opacity:1;transform:translateX(-50%) scale(1)}

/* 태우기: 쿨다운 링이 달린 원형 스킬 버튼 */
#burn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:68px;height:68px;padding:4px;border:0;border-radius:50%;
  background:conic-gradient(#ffd27a var(--p,100%),#2a221a 0);
  box-shadow:0 3px 10px rgba(0,0,0,.7);transition:transform .08s}
#burn .in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  background:radial-gradient(circle at 50% 30%,#ffb45a,#c9711f 60%,#7a3a10);border:2px solid #2a1300;color:#2a1300}
#btxt{font-family:var(--disp);font-size:16px}
#burn small{font-size:10px;font-weight:700;opacity:.75}
#burn:not(:disabled){animation:ready 1.8s ease-in-out infinite}
#burn:active:not(:disabled){transform:translateX(-50%) scale(.93)}
#burn:disabled .in{background:radial-gradient(circle at 50% 30%,#3a3026,#1d1812);border-color:#0a0908;color:#7d7264}

/* 사망 화면 */
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:radial-gradient(circle,rgba(34,9,7,.84),rgba(6,5,4,.93));opacity:0;pointer-events:none;transition:opacity .6s}
#over.show{opacity:1;pointer-events:auto}
.o1{font-family:var(--disp);font-size:34px;color:var(--bone);text-shadow:0 3px 0 #40100b,0 0 22px rgba(196,64,47,.5)}
.o2{padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid #5a3a1c;font-size:14px;font-weight:700;color:var(--ember)}
.o2:empty{display:none}
.o3{min-height:18px;font-size:12px;color:var(--dim)}
.o3:not(:empty){animation:blink 1.4s ease-in-out infinite}

/* 불꽃 / 적 체력 바 */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 0}
.bar{position:relative;height:24px;border-radius:12px;background:#0b0907;border:2px solid #2a2118;overflow:hidden;box-shadow:inset 0 2px 4px #000}
.fill{position:absolute;inset:0;transform-origin:left center;transition:transform .2s ease-out}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
.fill.fire{background:linear-gradient(90deg,#9a4416,var(--ember))}
.fill.foe{background:linear-gradient(90deg,#5a1710,#b2352b)}
.bar.low{animation:low .9s ease-in-out infinite}
.bar.low .fill.fire{background:linear-gradient(90deg,#6b1712,#d0503f)}
.bar span{position:relative;display:block;padding:0 9px;font-size:12px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff4e0;text-shadow:0 1px 2px #000}

#log{padding:8px 18px 2px;height:62px;overflow:hidden;font-family:var(--lore);font-size:12.5px;line-height:1.45;color:var(--dim)}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .new{color:var(--bone)}
#log .gold{color:var(--ember)}
#log .red{color:#c4584d}

/* 하단 탭바 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 8px 8px;
  background:linear-gradient(#15110d,#0c0a08);border-top:2px solid #2a2118;box-shadow:0 -8px 18px rgba(0,0,0,.5)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:6px 0 5px;
  border:0;border-radius:14px;background:none;color:var(--dim);font-size:12px;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--hot);background:linear-gradient(rgba(233,162,79,.18),rgba(233,162,79,.04));box-shadow:inset 0 2px 0 var(--ember)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(233,162,79,.7))}
.tabs button.ping::after{content:"";position:absolute;top:6px;left:calc(50% + 10px);width:11px;height:11px;border-radius:50%;
  background:var(--blood);border:2px solid #15110d;box-shadow:0 0 8px rgba(196,64,47,.8)}

/* 패널: 카드형 목록 */
#panel{flex:1;min-height:0;overflow-y:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch}
.modes{display:flex;justify-content:flex-end;padding:8px 0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#0b0907;border:1px solid var(--line);box-shadow:inset 0 1px 3px #000}
.chip{min-height:30px;padding:5px 14px;border:0;border-radius:999px;background:none;color:var(--dim);font-size:13px;font-weight:700}
.chip.on{background:linear-gradient(#f0b25e,#c9711f);color:#2a1300}
.note{margin:10px 0 8px;padding:10px 12px;border-radius:12px;background:var(--well);border:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.6}
.note b{color:var(--ember);font-weight:700}
.sec{padding:14px 2px 6px;font-size:12px;font-weight:700;color:var(--dim)}

.card{display:grid;grid-template-columns:46px 1fr auto;column-gap:12px;align-items:center;width:100%;margin:0 0 8px;padding:10px;
  text-align:left;color:var(--bone);border-radius:16px;border:1px solid #2f261c;
  background:linear-gradient(#1d1812,#14100c);box-shadow:0 2px 0 #050403;transition:transform .08s,border-color .2s}
.card:active:not(.own){transform:scale(.98)}
.card.can{border-color:#7a5428;box-shadow:0 2px 0 #050403,0 0 14px rgba(233,162,79,.12)}
.card.own{cursor:default}
.card.pop{animation:pop .4s ease-out}
.ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;color:var(--tc,var(--ember));
  background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.08),rgba(0,0,0,.35)),#0e0b08;border:1px solid #3a2f22}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.card:not(.can):not(.own) .ic svg{opacity:.5}
.mid{min-width:0}
.nm{display:flex;align-items:center;gap:7px}
.nm .n{font-family:var(--disp);font-size:18px;line-height:1.2;color:var(--bone)}
.card.can .n,.card.own .n{color:var(--hot)}
.lv{padding:0 7px;border-radius:999px;background:#0b0907;border:1px solid #3a2f22;font-size:11px;font-weight:700;line-height:18px;color:var(--dim)}
.lv:empty{display:none}
.ds{margin-top:2px;font-size:12px;color:var(--dim)}
.buy{min-width:78px;padding:7px 12px 8px;border-radius:12px;text-align:center;font-family:var(--disp);font-size:16px;line-height:1.15;
  background:#211b14;border:1px solid #2f261c;color:#6a5f52;box-shadow:0 3px 0 #0a0806}
.buy .c::before{content:"";display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:50%;vertical-align:-1px;opacity:.55;
  background:radial-gradient(circle at 35% 30%,#fff1c4,#e9a24f 60%,#8a4a14)}
.card.alt .buy .c::before{background:radial-gradient(circle at 35% 30%,#f1eadc,#9a8f7c 60%,#4a4136)}
.buy small{display:block;min-height:13px;font-family:var(--ui);font-size:11px;font-weight:700;opacity:.8}
.card.can .buy{background:linear-gradient(#f4b862,#cf7a22);border-color:#ffd18a;color:#2a1300;box-shadow:0 3px 0 #7a3a10}
.card.can .buy .c::before{opacity:1}
.card.can:active .buy{transform:translateY(2px);box-shadow:0 1px 0 #7a3a10}
.card.max .buy{background:none;border-color:transparent;box-shadow:none;color:var(--ember);font-size:15px}
.card.max .buy .c::before,.card.pick .buy .c::before{display:none}

.wipe{display:block;margin:22px auto 0;padding:8px 12px;background:none;border:0;color:#5a4a39;font-size:12px;text-decoration:underline}
.wipe.arm{color:var(--blood)}

@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.03);box-shadow:0 2px 0 #050403,0 0 22px rgba(255,190,100,.55)}100%{transform:scale(1)}}
@keyframes ready{
  0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.7),0 0 6px rgba(255,190,100,.25)}
  50%{box-shadow:0 3px 10px rgba(0,0,0,.7),0 0 20px rgba(255,190,100,.7)}}
@keyframes low{0%,100%{border-color:#2a2118}50%{border-color:#b2352b}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="floor"><b id="floor">1</b><span class="u">층</span><small id="best"></small></div>
    <div class="wallet">
      <div class="pill"><i class="coin"></i><span class="lb">영혼</span><b id="souls">0</b></div>
      <div class="pill ash"><i class="coin"></i><span class="lb">재</span><b id="ash">0</b><em id="prev"></em></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span class="brand">잿불</span><button class="snd" id="snd"></button></div>
    <div id="boss">보스</div>
    <button id="burn"><span class="in"><span id="btxt">태우기</span><small>−15%</small></span></button>
    <div id="over"><div class="o1">불꽃이 꺼졌다</div><div class="o2" id="o2"></div><div class="o3" id="o3"></div></div>
  </div>

  <div class="bars">
    <div class="bar" id="hpbar"><div class="fill fire" id="hpfill"></div><span id="hptxt"></span></div>
    <div class="bar"><div class="fill foe" id="efill"></div><span id="etxt"></span></div>
  </div>

  <div id="log"></div>

  <main id="panel"></main>

  <nav class="tabs">
    <button id="t0" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17l6-6 6 6"/><path d="M6 11l6-6 6 6"/></svg><span>성장</span></button>
    <button id="t1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 7-7 11-7-11z"/><path d="M5 10h14"/></svg><span>유물</span></button>
    <button id="t2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6z"/><path d="M6 10v9M10 10v9M14 10v9M18 10v9"/><path d="M4 20h16"/></svg><span>제단</span></button>
  </nav>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'ember-idle-v1';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- 숫자 표기 (만/억/조...) ---------- */
function fmt(n){
  if (!isFinite(n)) return '∞';
  n = Math.max(0, n);
  if (n < 10000) return String(Math.floor(n));
  const U = ['', '만', '억', '조', '경', '해', '자', '양'];
  const i = Math.floor(Math.log10(n) / 4);
  if (i >= U.length) return n.toExponential(2);
  const v = n / Math.pow(10000, i);
  let s = v >= 100 ? String(Math.floor(v)) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  if (s.includes('.')) s = s.replace(/\.?0+$/, '');
  return s + U[i];
}

/* ---------- 상태 ---------- */
const def = () => ({
  souls: 0, ash: 0, total: 0, best: 1, runs: 0,
  floor: 1, kills: 0, hp: 40, sps: 0, lastSeen: Date.now(),
  lv: { atk: 0, hp: 0, spd: 0, greed: 0 },
  meta: { ember: 0, leg: 0, desc: 0, hand: 0, eye: 0, auto: 0 },
  relics: [], offers: [], mute: false
});
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const o = JSON.parse(raw), d = def();
    return Object.assign(d, o, { lv: Object.assign(d.lv, o.lv), meta: Object.assign(d.meta, o.meta) });
  } catch (e) { return null; }
}
function save(){
  S.lastSeen = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

let S = load();
const fresh = !S;
if (fresh) S = def();

/* ---------- 능력치 ---------- */
const ashM = () => 1 + 0.1 * S.total;
const rel = id => S.relics.indexOf(id) >= 0;
const UP = {
  atk:   { name: '칼날', sub: '공격력',      base: 8,  g: 1.28, val: l => (3 + 2 * l) * ashM() * ALT.hand.val(S.meta.hand) * (rel('blade') ? 1.35 : 1) * (rel('pact') ? 1.6 : 1), show: v => fmt(v) },
  hp:    { name: '심지', sub: '최대 불꽃',   base: 10, g: 1.30, val: l => (40 + 15 * l) * ashM() * (rel('wick') ? 1.3 : 1), show: v => fmt(v) },
  spd:   { name: '맥박', sub: '공격 속도',   base: 25, g: 1.42, val: l => (0.8 + 0.08 * l) * (rel('fast') ? 1.3 : 1), show: v => v.toFixed(2) + '/초' },
  greed: { name: '탐식', sub: '영혼 획득',   base: 15, g: 1.36, val: l => (1 + 0.15 * l) * (1 + 0.05 * S.total) * ALT.eye.val(S.meta.eye) * (rel('cup') ? 1.5 : 1), show: v => '×' + v.toFixed(2) }
};
const ALT = {
  auto:  { name: '자동 성장', sub: '가장 싼 성장을 알아서 산다', base: 12, g: 1, max: 1, val: l => l, show: v => (v ? '켜짐' : '꺼짐') },
  ember: { name: '온기', sub: '불꽃이 사그라드는 속도',  base: 3, g: 1.8, val: l => Math.pow(0.94, l), show: v => '×' + v.toFixed(2) },
  hand:  { name: '재의 손', sub: '공격력',               base: 6, g: 1.9, val: l => 1 + 0.2 * l,       show: v => '×' + v.toFixed(2) },
  eye:   { name: '재의 눈', sub: '영혼 획득',            base: 4, g: 1.8, val: l => 1 + 0.25 * l,      show: v => '×' + v.toFixed(2) },
  leg:   { name: '유품', sub: '다음 불꽃의 시작 영혼',    base: 2, g: 1.8, val: l => 25 * l,            show: v => fmt(v) },
  desc:  { name: '기억', sub: '다음 불꽃의 시작 층',      base: 5, g: 1.8, val: l => 1 + 2 * l,         show: v => v + '층' }
};
const RELICS = {
  wick:   { n: '굳은 심지',   d: '최대 불꽃 +30%' },
  blade:  { n: '녹슨 훈장',   d: '공격력 +35%' },
  cup:    { n: '탐욕의 잔',   d: '영혼 획득 +50%' },
  hunger: { n: '굶주린 불',   d: '처치할 때 회복량 2배' },
  cloak:  { n: '재의 외투',   d: '불꽃이 30% 느리게 사그라든다' },
  thorn:  { n: '가시 촛농',   d: '맞을 때 같은 피해를 되돌려준다' },
  fast:   { n: '떨리는 손',   d: '공격 속도 +30%' },
  mirror: { n: '깨진 거울',   d: '15% 확률로 3배 피해' },
  last:   { n: '마지막 숨',   d: '불꽃이 20% 이하면 공격력 2배' },
  pact:   { n: '어둠의 계약', d: '공격력 +60%, 불꽃 소모 +30%' },
  echo:   { n: '메아리',      d: '20% 확률로 한 번 더 공격' },
  well:   { n: '영혼 우물',   d: '층을 내려갈 때 영혼 2배 보너스' }
};
const maxHP = () => UP.hp.val(S.lv.hp);
const atkV  = () => UP.atk.val(S.lv.atk) * (rel('last') && S.hp < maxHP() * 0.2 ? 2 : 1);
const apsV  = () => UP.spd.val(S.lv.spd);
const soulM = () => UP.greed.val(S.lv.greed);
const drain = () => maxHP() * 0.010 * (1 + 0.04 * S.floor) * ALT.ember.val(S.meta.ember) * (rel('cloak') ? 0.7 : 1) * (rel('pact') ? 1.3 : 1);
const killHeal = () => 0.08 + (rel('hunger') ? 0.08 : 0);

let AC = null;
function audio(){
  if (S.mute) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f0, f1, dur, type, vol, delay){
  const a = audio(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

function offerRelic(){

/* ---------- 업데이트 ---------- */
function update(dt){
  if (dead) {
    deadAge += dt; deadT -= dt;
    if (deadAge > 1 && !$('o3').textContent) $('o3').textContent = '탭하면 다시 불을 지핀다';
    if (deadT <= 0) revive();
    return;
  }
  S.hp -= drain() * dt;
  if (burnT > 0) burnT = Math.max(0, burnT - dt);
  if (S.meta.auto) { autoT += dt; if (autoT >= 0.5) { autoT = 0; autoBuy(); } }
  if (!E) {
    spawnT -= dt;
    if (spawnT <= 0) spawn();
  } else {
    heroT += dt;
    const iv = 1 / apsV();
    let guard = 0;
    while (E && heroT >= iv && guard++ < 20) { heroT -= iv; hit(atkV(), 'auto'); }
    if (E) {
      foeT += dt;
      while (foeT >= 1.5) { foeT -= 1.5; foeHit(); }
    }
  }
  if (S.hp <= 0) { die(); return; }

  secT += dt;
  if (secT >= 1) { secT -= 1; S.sps = S.sps * 0.9 + gainAcc * 0.1; gainAcc = 0; }
  idleT -= dt;
  if (idleT <= 0) { idleT = rint(22, 38); say(pick(IDLE)); }
}

/* ---------- 구매 ---------- */
function plan(d, l, cur, cap){
  let n = 0, sum = 0;
  while (n < cap && (d.max == null || l + n < d.max)) {
    const c = Math.ceil(d.base * Math.pow(d.g, l + n));
    if (sum + c > cur) break;
    sum += c; n++;
  }
  if (n === 0) {
    if (d.max != null && l >= d.max) return { n: 0, cost: 0, maxed: true };
    return { n: 0, cost: Math.ceil(d.base * Math.pow(d.g, l)) };
  }
  return { n, cost: sum };
}
const capOf = () => (mode === 1 ? 1 : mode === 10 ? 10 : 500);

function applyBuy(isUp, key, cap){
  const d = isUp ? UP[key] : ALT[key], lvs = isUp ? S.lv : S.meta;
  const p = plan(d, lvs[key], isUp ? S.souls : S.ash, cap);
  if (!p.n) return 0;
  if (isUp) S.souls -= p.cost; else S.ash -= p.cost;
  const before = maxHP();
  lvs[key] += p.n;
  if (isUp && key === 'hp') S.hp += maxHP() - before;
  return p.n;
}
function buy(isUp, key){
  if (!applyBuy(isUp, key, capOf())) return;
  sfx('buy');
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  updatePanel(); ui();
  const r = rows[key];
  if (r) { r.el.classList.remove('pop'); void r.el.offsetWidth; r.el.classList.add('pop'); }
}
function autoBuy(){
  for (let i = 0; i < 3; i++) {
    let bk = null, bc = Infinity;
    for (const k in UP) {
      const p = plan(UP[k], S.lv[k], S.souls, 1);
      if (p.n && p.cost < bc) { bc = p.cost; bk = k; }
    }
    if (!bk) break;
    applyBuy(true, bk, 1);
  }
}

    const p = plan(d, l, r.isUp ? S.souls : S.ash, capOf());
    r.n.textContent = d.name;
    r.lv.textContent = d.max ? '' : 'Lv ' + l;
    if (p.maxed) {
      r.ds.textContent = d.sub + ' — ' + d.show(d.val(l));
      r.c.textContent = '완료'; r.s.textContent = '';
      r.el.classList.remove('can'); r.el.classList.add('max');
      return;
    }
    r.ds.textContent = d.sub + ' ' + d.show(d.val(l)) + ' → ' + d.show(d.val(l + (p.n || 1)));
    r.el.classList.remove('max');
    r.c.textContent = fmt(p.cost);
    r.s.textContent = p.n > 1 ? '×' + p.n : '';
    r.el.classList.toggle('can', p.n > 0);
  });
  const nt = $('altnote');
  if (nt) nt.innerHTML = '불꽃이 꺼지면 재가 남는다. 재는 쓰더라도 누적된 만큼 모든 것을 강하게 한다.<br><b>누적 재 ' + fmt(S.total) + '</b> — 공격·체력 +' + fmt(S.total * 10) + '%, 영혼 +' + fmt(S.total * 5) + '%';
}
function altAffordable(){
  return Object.keys(ALT).some(k => plan(ALT[k], S.meta[k], S.ash, 1).n > 0);
}
function ui(){
  const mx = maxHP(), hf = Math.max(0, Math.min(1, S.hp / mx));
  $('floor').textContent = S.floor;
  $('best').textContent = '최심 ' + S.best + '층 · 소멸 ' + S.runs + '회';
  $('souls').textContent = fmt(S.souls);
  $('ash').textContent = fmt(S.ash);
  $('prev').textContent = dead ? '' : '+' + fmt(ashGain(S.floor));
  $('hpfill').style.transform = 'scaleX(' + hf + ')';
  $('hptxt').textContent = '불꽃 ' + fmt(Math.max(0, S.hp)) + ' / ' + fmt(mx);
  $('hpbar').classList.toggle('low', hf < 0.3);
  if (E) {
    $('efill').style.transform = 'scaleX(' + Math.max(0, E.hp / E.max) + ')';
    $('etxt').textContent = E.name + ' ' + fmt(E.hp);
  } else {
    $('efill').style.transform = 'scaleX(0)';
    $('etxt').textContent = dead ? '' : '…';
  }
  $('t1').classList.toggle('ping', S.offers.length > 0);
  $('t2').classList.toggle('ping', altAffordable());
  const bb = $('burn'), ready = !dead && !!E && burnT <= 0 && S.hp >= mx * 0.3;
  bb.disabled = !ready;
  bb.style.setProperty('--p', (burnT > 0 ? (1 - burnT / BURN_CD) * 100 : (S.hp < mx * 0.3 ? 0 : 100)) + '%');
  $('boss').classList.toggle('show', !!(E && E.boss));
  $('btxt').textContent = burnT > 0 ? Math.ceil(burnT) + '초' : '태우기';
  updatePanel();
}

/* ---------- 그리기 ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let cw = 360, ch = 220, dpr = 1;
const G = { hx: 90, hy: 120, gy: 170, ex: 270, bh: 80 };
function resize(){
  const r = $('stage').getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = r.width || 360; ch = r.height || 220;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}

function draw(dt, t){
  const W = cw, H = ch;
  const gy = H * 0.8, hx = W * 0.24, ex = W * 0.74;
  const mx = maxHP(), hpF = dead ? 0 : Math.max(0, Math.min(1, S.hp / mx));
  const candleH = 8 + H * 0.2 * hpF;
  const fs = (7 + 9 * hpF) * (1 + pulse);
  const hy = gy - candleH - fs * 1.1;
  const boss = !!(E && E.boss);
  const bh = H * 0.36 * (boss ? 1.5 : 1);
  G.hx = hx; G.hy = hy; G.gy = gy; G.ex = ex; G.bh = bh;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  shake *= 0.86;

  /* 배경: 층마다 달라지는 기둥 */
  let sd = S.floor * 9301 + 49297;
  const rnd = () => { sd = (sd * 9301 + 49297) % 233280; return sd / 233280; };
  ctx.fillStyle = '#1b1612';
  for (let i = 0; i < 7; i++) {
    const px = rnd() * W, pw = 12 + rnd() * 30, ph = H * (0.35 + rnd() * 0.55);
    ctx.fillRect(px, gy - ph, pw, ph);
  }
  ctx.fillStyle = '#13100d'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#2f271e'; ctx.fillRect(0, gy, W, 1);

  /* 적 몸통 */
  if (E) {
    const bw = H * 0.17 * (boss ? 1.5 : 1);
    const x = ex - E.lunge * 38, bob = Math.sin(t * 2.1 + E.seed) * 3;
    ctx.beginPath();
    ctx.moveTo(x - bw, gy);
    ctx.bezierCurveTo(x - bw * 1.1, gy - bh * 0.6 + bob, x - bw * 0.6, gy - bh + bob, x, gy - bh + bob);
    ctx.bezierCurveTo(x + bw * 0.6, gy - bh + bob, x + bw * 1.1, gy - bh * 0.6 + bob, x + bw, gy);
    for (let i = 1; i <= 6; i++) {
      ctx.lineTo(x + bw - (2 * bw * i / 6), gy - (i % 2 ? bw * 0.35 : 0) + Math.sin(t * 3 + i) * 2);
    }
    ctx.closePath();
    ctx.fillStyle = E.flash > 0.05 ? '#9b8971' : '#3a3026';
    ctx.fill();
    ctx.strokeStyle = '#5a4a39'; ctx.lineWidth = 1; ctx.stroke();
    E.flash = Math.max(0, E.flash - dt * 6);
    E.lunge = Math.max(0, E.lunge - dt * 5);
  }

  /* 양초 */
  if (!dead || candleH > 0) {
    const cwid = 12;
    ctx.fillStyle = '#b9ad98';
    ctx.fillRect(hx - cwid / 2, gy - candleH, cwid, candleH);
    ctx.fillStyle = '#8f846f';
    ctx.fillRect(hx - cwid / 2, gy - candleH, 3, candleH);
    ctx.fillStyle = '#cfc4ae';
    ctx.beginPath(); ctx.ellipse(hx, gy - candleH, cwid / 2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9ad98';
    ctx.beginPath(); ctx.ellipse(hx + 6, gy - candleH + 7 + hpF * 5, 2, 5 + hpF * 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  /* 어둠 — 빛의 반경은 불꽃의 양 */
  const fl = 1 + 0.07 * Math.sin(t * 17) + 0.05 * Math.sin(t * 29 + 1);
  const depthK = Math.max(0.55, 1 - S.floor * 0.008);
  const R = dead ? 28 : (44 + W * 0.62 * Math.pow(hpF, 0.8) * depthK) * (0.975 + 0.025 * fl);
  const dk = ctx.createRadialGradient(hx, hy, 0, hx, hy, R);
  dk.addColorStop(0, 'rgba(6,5,4,0)');
  dk.addColorStop(0.5, 'rgba(6,5,4,0.22)');
  dk.addColorStop(0.85, 'rgba(6,5,4,0.8)');
  dk.addColorStop(1, 'rgba(6,5,4,0.97)');
  ctx.fillStyle = dk; ctx.fillRect(-20, -20, W + 40, H + 40);

  /* 불꽃 */
  if (!dead) {
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, 70 * fl * (0.5 + hpF * 0.5));
    gr.addColorStop(0, 'rgba(233,162,79,0.38)'); gr.addColorStop(1, 'rgba(233,162,79,0)');
    ctx.fillStyle = gr; ctx.fillRect(hx - 90, hy - 90, 180, 180);
    ctx.globalCompositeOperation = 'source-over';

    const s = fs * fl, sway = Math.sin(t * 9) * s * 0.25 * (1 + (1 - hpF));
    ctx.beginPath();
    ctx.moveTo(hx, hy + s);
    ctx.bezierCurveTo(hx + s * 1.1, hy + s * 0.9, hx + s * 0.9, hy - s * 0.2, hx + sway, hy - s * 2.2);
    ctx.bezierCurveTo(hx - s * 0.9, hy - s * 0.2, hx - s * 1.1, hy + s * 0.9, hx, hy + s);
    const fg = ctx.createRadialGradient(hx, hy + s * 0.3, 0, hx, hy + s * 0.3, s * 1.5);
    fg.addColorStop(0, '#fff4d2'); fg.addColorStop(0.5, '#e9a24f'); fg.addColorStop(1, '#8a2f12');
    ctx.fillStyle = fg; ctx.fill();

    if (Math.random() < 0.7 * dt * 60 * (0.4 + hpF)) {
      P.push({ k: 'ember', x: hx + rint(-4, 4), y: hy - s * 1.5, vx: rint(-12, 12), vy: rint(-55, -20), life: rint(0.7, 1.5), max: 1.5, r: rint(0.8, 1.6) });
    }
  } else if (Math.random() < 0.25) {
    P.push({ k: 'ash', x: hx, y: gy - candleH, vx: rint(-6, 6), vy: rint(-30, -14), life: 2, max: 2, r: 1.6 });
  }

  /* 적의 눈 — 어둠 속에서도 보인다 */
  if (E) {
    const bob = Math.sin(t * 2.1 + E.seed) * 3, x = ex - E.lunge * 38;
    const n = E.boss ? 5 : 2 + (E.tier >= 2 ? 1 : 0) + (E.tier >= 4 ? 1 : 0);
    const spread = H * 0.17 * (E.boss ? 1.5 : 1) * 0.65;
    const eyeY = gy - bh * 0.62 + bob;
    const blink = Math.sin(t * 1.7 + E.seed * 7) > 0.97 ? 0.15 : 1;
    const col = E.boss ? '239,230,211' : '255,90,70';
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const ox = n > 1 ? (i - (n - 1) / 2) * (spread * 2 / (n - 1)) : 0;
      const oy = E.boss ? -Math.abs(i - (n - 1) / 2) * 5 : 0;
      const r = (E.boss ? 3.2 : 2.4) * blink;
      const eg = ctx.createRadialGradient(x + ox, eyeY + oy, 0, x + ox, eyeY + oy, r * 5);
      eg.addColorStop(0, 'rgba(' + col + ',0.75)'); eg.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = eg; ctx.fillRect(x + ox - r * 5, eyeY + oy - r * 5, r * 10, r * 10);
      ctx.fillStyle = 'rgb(' + col + ')';
      ctx.beginPath(); ctx.arc(x + ox, eyeY + oy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 파티클 */
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (p.k === 'ember' || p.k === 'ash') {
      p.life -= dt; if (p.life <= 0) { P.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === 'ash') { p.vx *= 0.98; p.vy += 25 * dt; }
      const a = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.k === 'ember' ? 'rgba(255,190,100,' + a + ')' : 'rgba(150,140,125,' + a * 0.8 + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (p.k === 'mote') {
      p.t += dt / 0.65;
      if (p.t < 0) continue;
      if (p.t >= 1) { pulse = Math.min(0.35, pulse + 0.05); P.splice(i, 1); continue; }
      const u = p.t, v = 1 - u;
      const x = v * v * p.sx + 2 * v * u * p.cx + u * u * hx;
      const y = v * v * p.sy + 2 * v * u * p.cy + u * u * hy;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,214,140,0.9)';
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,190,100,0.25)';
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.k === 'bolt') {
      p.t += dt / p.life;
      if (p.t >= 1) { P.splice(i, 1); continue; }
      const x = p.x + (p.tx - p.x) * p.t, y = p.y + (p.ty - p.y) * p.t;
      const x0 = p.x + (p.tx - p.x) * Math.max(0, p.t - 0.35), y0 = p.y + (p.ty - p.y) * Math.max(0, p.t - 0.35);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.tap ? 'rgba(255,245,220,0.95)' : 'rgba(255,200,120,0.85)';
      ctx.lineWidth = p.tap ? 3 : 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (P.length > 400) P.splice(0, P.length - 400);
  pulse *= Math.pow(0.02, dt);

  /* 떠오르는 숫자 */
  ctx.textAlign = 'center';
  for (let i = F.length - 1; i >= 0; i--) {
    const f = F[i];
    if (f.d > 0) { f.d -= dt; continue; }
    f.life -= dt; if (f.life <= 0) { F.splice(i, 1); continue; }
    f.y += f.vy * dt;
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = '400 ' + (f.s + 2) + 'px "Do Hyeon","Noto Sans KR",sans-serif';
    ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#1a0f06';
    ctx.strokeText(f.t, f.x, f.y);
    ctx.fillStyle = f.c; ctx.fillText(f.t, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  if (F.length > 60) F.splice(0, F.length - 60);

  ctx.restore();

  /* 태우기 섬광 */
  if (flare > 0) {
    ctx.fillStyle = 'rgba(255,214,140,' + flare * 0.22 + ')'; ctx.fillRect(0, 0, W, H);
    flare = Math.max(0, flare - dt * 3);
  }

  /* 피격 플래시 */
  if (heroFlash > 0) {
    ctx.fillStyle = 'rgba(178,53,43,' + heroFlash * 0.28 + ')'; ctx.fillRect(0, 0, W, H);
    heroFlash = Math.max(0, heroFlash - dt * 4);
  }

  /* 처치 진행 점 */
  const nk = need(S.floor);
  for (let i = 0; i < nk; i++) {
    ctx.beginPath(); ctx.arc(22 + i * 12, 20, nk === 1 ? 5 : 3.2, 0, Math.PI * 2);
    if (i < S.kills) { ctx.fillStyle = '#e9a24f'; ctx.fill(); }
    else { ctx.strokeStyle = nk === 1 ? '#b2352b' : '#4a4136'; ctx.lineWidth = 1; ctx.stroke(); }
  }
}

/* ---------- 입력 ---------- */
$('stage').addEventListener('pointerdown', e => {
  if (dead) { if (deadAge > 1) deadT = 0; return; }
  const now = performance.now();
  if (now - lastTap < 80) return;
  lastTap = now;
  if (E) hit(atkV() * 0.5, 'tap');
});
$('burn').addEventListener('pointerdown', e => e.stopPropagation());
$('burn').onclick = burn;
$('snd').addEventListener('pointerdown', e => e.stopPropagation());
$('snd').onclick = () => { S.mute = !S.mute; $('snd').textContent = S.mute ? '소리 끔' : '소리 켬'; if (!S.mute) sfx('buy'); save(); };
document.addEventListener('pointerdown', () => { audio(); });
['t0', 't1', 't2'].forEach((id, i) => {
  $(id).onclick = () => { tab = i; ['t0', 't1', 't2'].forEach((x, j) => $(x).classList.toggle('on', j === i)); buildPanel(); };
});

/* ---------- 부재 중 보상 / 저장 ---------- */
function offline(){
  const el = (Date.now() - S.lastSeen) / 1000;
  if (el < 60 || !S.sps) return;
  const g = S.sps * Math.min(el, 7200) * 0.5;
  if (g >= 1) { S.souls += g; say('불꽃이 없는 동안 영혼 ' + fmt(g) + '개가 모였다.', 'gold'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else { offline(); last = performance.now(); ui(); }
});
window.addEventListener('pagehide', save);
setInterval(save, 5000);
setInterval(ui, 100);

/* ---------- 시작 ---------- */
if (fresh) {
  newRun();
  say('어둠 속에서 눈을 뜬다. 손에는 작은 불꽃뿐.');
  say('화면을 누르면 불꽃이 날아간다. 가운데 버튼은 불꽃을 태워 일격을 가한다.');
} else {
  if (!Array.isArray(S.relics)) S.relics = [];
  if (!Array.isArray(S.offers)) S.offers = [];
  S.hp = Math.max(1, Math.min(S.hp, maxHP()));
  if (S.hp <= 1) S.hp = maxHP();
  offline();
  say('다시 어둠 속. 불꽃은 아직 타고 있다.');
}
$('snd').textContent = S.mute ? '소리 끔' : '소리 켬';
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
buildPanel(); ui();

let last = performance.now(), acc = 0;
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  while (acc >= 0.05) { update(0.05); acc -= 0.05; }
  draw(dt, now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
